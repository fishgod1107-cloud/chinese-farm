<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="國語小農場">
<meta name="theme-color" content="#d8f1ff">
<meta name="format-detection" content="telephone=no">
<title>國語小農場</title>
<style>
:root{
  --pink:#ff8fb8;--pink-d:#f06292;--pink-l:#ffe3ee;
  --mint:#9be3c9;--mint-d:#4fc3a1;--mint-dd:#2f9f80;
  --yellow:#ffe58a;--purple:#cdb4f6;--purple-d:#9575cd;
  --soil:#c98f5a;--soil-d:#a56f3f;
  --ink:#5a4a63;--card:#fffdfb;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{
  font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC","Heiti TC",sans-serif;
  font-weight:700;color:var(--ink);font-size:24px;line-height:1.5;
  background:
    radial-gradient(circle at 12% 12%,#fff8 0 40px,transparent 41px),
    radial-gradient(circle at 85% 20%,#fff8 0 60px,transparent 61px),
    linear-gradient(180deg,#d8f1ff 0%,#eaf9e0 45%,#d6f0b8 100%);
  background-attachment:fixed;
  user-select:none;-webkit-user-select:none;
}
#view{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:14px 16px 40px}

/* 注音 */
.zc{display:inline-flex;align-items:center;vertical-align:middle}
.z{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;position:relative;
  font-size:.4em;line-height:1;width:1em;margin:0 .6em 0 .1em;font-weight:700;opacity:.9}
.z i{font-style:normal;display:block}
.z b{position:absolute;left:.92em;bottom:.28em;font-weight:400}

/* 共用 */
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation} /* manipulation:iPad 連點不會放大畫面 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.3em;min-height:64px;padding:8px 22px;border-radius:999px;
  background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink-d)}
.btn.mint{background:var(--mint-d);box-shadow:0 5px 0 var(--mint-dd)}
.btn.purple{background:var(--purple-d);box-shadow:0 5px 0 #6d4fb0}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 #e6d5ea}
.btn.small{min-height:48px;font-size:18px;padding:4px 16px}
.btn:disabled{opacity:.45;cursor:default}
.card{background:var(--card);border-radius:28px;padding:18px;box-shadow:0 8px 0 #cfe6c0,0 12px 24px #7fae6033;border:4px solid #fff;margin-bottom:16px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.center{text-align:center;justify-content:center}
.sp{flex:1}
h1{font-size:36px;margin:6px 0;color:#3f9b5f;text-shadow:0 3px 0 #fff}
h2{font-size:28px;margin:8px 0;color:var(--purple-d)}
.hud{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:#fff;border-radius:999px;padding:2px 16px;box-shadow:0 4px 0 #cfe6c0;font-size:22px;white-space:nowrap}
.tip{font-size:19px;color:#8a7a93;font-weight:400}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}

/* 首頁 */
.mascot{font-size:72px;line-height:1.1;display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-3deg)}}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
@keyframes jump{0%,100%{transform:none}30%{transform:translateY(-30px) scale(1.15)}60%{transform:translateY(0) scale(.95)}}
.name{font:inherit;font-size:24px;color:var(--ink);border:4px solid #d8efc9;border-radius:18px;padding:4px 12px;width:7em;background:#fff;user-select:text;-webkit-user-select:text}
.name:focus{outline:none;border-color:var(--mint-d)}
.grade{display:flex;gap:10px;margin:12px 0}
.grade button{flex:1;min-height:72px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #cfe6c0;font-size:26px}
.grade button.on{background:var(--mint-d);color:#fff;box-shadow:0 5px 0 var(--mint-dd)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{position:relative;min-height:128px;border-radius:26px;padding:8px;background:#fff;box-shadow:0 6px 0 #cfe6c0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:24px;line-height:1.35}
.tile:active{transform:translateY(4px);box-shadow:0 2px 0 #cfe6c0}
.tile .ue{font-size:46px;line-height:1.2}
.tile.big{grid-column:1/-1;min-height:112px;flex-direction:row;gap:16px;font-size:30px;background:linear-gradient(120deg,#ffd1e3,#fff3b8,#c9f3e2)}
.tile.farm{background:#f1ffe6}.tile.game{background:#fff6dc}
.dot{position:absolute;top:-6px;right:-4px;min-width:32px;height:32px;border-radius:16px;background:#ff5252;color:#fff;font-size:19px;line-height:32px;padding:0 6px;animation:pop .6s}

/* 故事列表 */
.slist{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sitem{position:relative;background:#fff;border-radius:22px;padding:10px 6px;box-shadow:0 5px 0 #cfe6c0;display:flex;flex-direction:column;align-items:center;font-size:30px;line-height:1.4}
.sitem .ue{font-size:42px;line-height:1.2}
.sitem.lock{opacity:.55}
.sitem .ck{position:absolute;top:4px;right:10px;font-size:20px}
.story{font-size:25px;line-height:1.85;font-weight:500;text-align:left}
.moral{background:#fff8dc;border:4px dashed #f0c94f;border-radius:20px;padding:10px 14px;font-size:22px;margin-top:12px;font-weight:700}
.big-idi{font-size:44px;line-height:1.5;text-align:center}

/* 測驗 */
.stem{font-size:26px;line-height:1.7}
.body{font-size:24px;line-height:1.8;font-weight:500;margin-top:8px;background:#f6fff0;border-radius:18px;padding:10px 14px;text-align:left}
.opts{display:grid;gap:12px;margin-top:14px}
.opt{width:100%;min-height:76px;border-radius:22px;background:#fff;box-shadow:0 6px 0 #cfe6c0;border:4px solid #fff;font-size:34px;padding:6px 12px;line-height:1.45}
.opt.txt{font-size:22px;font-weight:700}
.opt.chr{font-size:44px}
.opts.chars{grid-template-columns:repeat(2,1fr)}
.opt:active{transform:translateY(4px)}
.opt.right{background:#e6fbf0;border-color:var(--mint-d);box-shadow:0 6px 0 var(--mint-d)}
.opt.wrong{background:#ffeaf0;border-color:var(--pink-d);box-shadow:0 6px 0 var(--pink-d);animation:shake .45s}
.opt.dim{opacity:.5}
.opt.pick{background:#fff6d6;border-color:#f5b800;box-shadow:0 6px 0 #e0a800}
.mnav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:4px 0 12px}
.mn{width:44px;height:44px;border-radius:12px;background:#fff;border:3px solid #e3dccb;font-size:20px;font-weight:700;color:#8a7f66;padding:0}
.mn.ok{background:#e6fbf0;border-color:var(--mint-d);color:#2f9f80}
.mn.cur{border-color:#f5b800;box-shadow:0 0 0 3px #ffe58a}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mprog{position:relative;height:20px;border-radius:10px;background:#fff;margin:12px 34px 14px 6px;box-shadow:inset 0 2px 4px #0001}
.mprog i{display:block;height:100%;border-radius:10px;background:linear-gradient(90deg,#9be3c4,#ffd36b);transition:width .4s}
.mchick{position:absolute;top:-10px;font-size:30px;transition:left .4s}
.mflag{position:absolute;right:-32px;top:-8px;font-size:28px}
.mtag{display:inline-block;border-radius:999px;padding:2px 14px;font-size:18px;font-weight:700;background:#efe6ff;color:#6a4fa3;margin-right:6px}
.mtag.hot{background:#ffe3d6;color:#d9531e}.mtag.cool{background:#e1f6e8;color:#2f9f80}
.ob{font-size:.75em;margin-right:8px}
.opt.pick{animation:pop .3s}
.mpaper.c0{background:linear-gradient(120deg,#d6f0ff,#e3ffd9)}.mpaper.c1{background:linear-gradient(120deg,#ffe0ec,#fff0c2)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.pulse{animation:pulse 1.2s ease-in-out infinite}
.mrow{border-radius:16px;padding:10px 12px;margin-top:10px;background:#fff}
.mrow.bad{background:#fff0f4;border:3px solid var(--pink-d)}
.mrow.good{border:3px solid #cfe9d6}
.blank{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--pink-d);color:var(--pink-d);text-align:center}
.bar{height:16px;border-radius:8px;background:#fff;overflow:hidden;margin:6px 0 14px;box-shadow:inset 0 2px 4px #0001}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--mint-d));border-radius:8px;transition:width .3s}
.fb{font-size:30px;text-align:center;margin:6px 0}
.spk{min-height:48px;width:56px;border-radius:50%;background:var(--purple);box-shadow:0 4px 0 var(--purple-d);font-size:24px}

/* 農場 */
.field{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:linear-gradient(#b7e48c,#9ed76f);padding:14px;border-radius:26px;box-shadow:inset 0 4px 0 #fff6}
.plot{position:relative;min-height:120px;border-radius:22px;background:var(--soil);box-shadow:0 5px 0 var(--soil-d);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:18px;line-height:1.3}
.plot:active{transform:translateY(4px);box-shadow:0 1px 0 var(--soil-d)}
.plot .pe{font-size:52px;line-height:1.15}
.plot.empty{background:#d9a875;opacity:.9}
.plot.buy{background:#e9dfc9;color:var(--ink);box-shadow:0 5px 0 #c9bd9f}
.plot.ripe{background:#f0b66a;animation:bob 1.4s ease-in-out infinite}
.scene{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:flex-end;justify-content:center;min-height:84px;margin-bottom:10px;padding:8px 12px 2px;border-radius:26px;
  background:linear-gradient(#cfeeff 0%,#e9f9ff 60%,#b7e48c 60%);font-size:50px;line-height:1.2;box-shadow:inset 0 4px 0 #fff6}
.scene span{animation:bob 3s ease-in-out infinite}
.pen{background:linear-gradient(#f6e3b4,#efd48f);box-shadow:inset 0 4px 0 #fff6}
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.shop button{min-height:92px;border-radius:20px;background:#fff;box-shadow:0 5px 0 #cfe6c0;font-size:19px;line-height:1.35;padding:6px}
.shop button .ue{font-size:38px;display:block;line-height:1.2}
.shop button:disabled{opacity:.45}

/* 小遊戲 */
.slots{display:flex;gap:10px;justify-content:center;margin:12px 0}
.slot{width:72px;height:96px;border-radius:18px;border:4px dashed #cbb8df;background:#fff;font-size:42px;display:flex;align-items:center;justify-content:center}
.slot.on{border-style:solid;border-color:var(--mint-d);background:#f0fff8}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.tl{width:78px;height:100px;border-radius:20px;background:#fff6dc;box-shadow:0 5px 0 #f0c94f;font-size:44px;display:flex;align-items:center;justify-content:center}
.tl:disabled{opacity:.25}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cd{min-height:116px;border-radius:20px;background:linear-gradient(135deg,#8fd6a6,#5fbf86);box-shadow:0 5px 0 #3f9b5f;font-size:44px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.25;padding:4px}
.cd.up{background:#fff;box-shadow:0 5px 0 #cfe6c0;font-size:28px}
.cd.up.b{font-size:20px;background:#fff9e0}
.cd.up.b .ue{font-size:38px}
.cd.done{background:#e6fbf0;box-shadow:0 5px 0 var(--mint-d);animation:pop .4s}

/* 圖鑑 */
.book{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bk{background:#fff;border-radius:22px;padding:10px 4px;box-shadow:0 5px 0 #cfe6c0;display:flex;flex-direction:column;align-items:center;font-size:28px;line-height:1.4}
.bk.lock{background:#ece8f0;color:#b3a7bb;box-shadow:0 5px 0 #d5ccdc}
.bk .ue{font-size:44px;line-height:1.2}

/* 一、二年級有注音的文字:字放大、行距加寬 */
.zb{font-size:26px;line-height:2.5}
.story.zb{font-size:27px;line-height:2.7}
.opt.txt.zb{font-size:24px;line-height:2.4;text-align:left}
.cd.up.b{line-height:2.2}
.cd.up.b .z{margin-right:.55em}
/* 考試測驗 */
.ztag{display:inline-block;padding:0 .35em;border-radius:.4em;background:#fff3c9;color:#a6590d}
.opt.mid{font-size:30px}
.slots2{min-height:84px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;background:#fff;border:4px dashed #cbb8df;border-radius:20px;padding:8px;margin-bottom:12px}
.chip{background:#e6fbf0;border-radius:16px;padding:4px 12px;box-shadow:0 4px 0 var(--mint-d);font-size:30px;line-height:1.9}
.tl.wd{width:auto;min-width:78px;padding:0 14px;height:auto;min-height:84px;font-size:28px;line-height:1.9}
.tl.hint{background:#fff0a8;animation:bob 1s infinite}
.tile small{font-weight:500}
/* 小遊戲 */
.holes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hole{position:relative;height:132px;border-radius:50%/42%;background:radial-gradient(#6b4423 0 55%,#a56f3f 56% 100%);box-shadow:inset 0 8px 0 #0004;overflow:hidden;padding:0}
.mw{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center}
.mole{display:flex;flex-direction:column;align-items:center;animation:popUp .25s ease-out;transform-origin:bottom;margin-bottom:-6px}
.mole .face{font-size:58px;line-height:1}
.mole .sign{background:#fff;border-radius:12px;padding:0 8px;font-size:22px;line-height:1.8;box-shadow:0 3px 0 #0003;max-width:112px;white-space:nowrap;color:var(--ink)}
.mole .sign.sm{font-size:17px}
.mw.hit .face{filter:hue-rotate(90deg)}
.mw.shk{animation:shake .4s}
.mw.show .sign{background:#b9f3d3}
@keyframes popUp{from{transform:translateY(85%)}to{transform:none}}
.pond{position:relative;height:340px;border-radius:24px;overflow:hidden;background:linear-gradient(#8fd3ff,#4aa3df);box-shadow:inset 0 6px 0 #fff6}
.fish{position:absolute;left:-50%;display:flex;align-items:center;gap:4px;background:#ffffffcc;border-radius:999px;padding:2px 12px;font-size:22px;white-space:nowrap;color:var(--ink)}
.fish .fe{font-size:36px}
.fish.caught{animation:catchUp .7s forwards!important}
.fish.bad{opacity:.4;animation-play-state:paused!important}
@keyframes swimR{from{left:-50%}to{left:100%}}
@keyframes swimL{from{left:100%}to{left:-50%}}
@keyframes catchUp{to{top:-20%;transform:scale(.4)}}
.orchard{position:relative;height:min(58vh,420px);border-radius:24px;overflow:hidden;background:linear-gradient(#cfeeff,#e9f9ff 72%,#b7e48c 72%);touch-action:none}
.fruit{position:absolute;left:0;top:0;width:92px;text-align:center;line-height:1.2;pointer-events:none;will-change:transform}
.fruit .fe{font-size:44px;display:block}
.fruit .fl{display:inline-block;background:#fff;border-radius:10px;padding:0 6px;font-size:19px;line-height:1.7;color:var(--ink)}
.basket{position:absolute;left:0;bottom:6px;width:100px;text-align:center;font-size:62px;line-height:1;pointer-events:none;will-change:transform}
.ord{display:flex;align-items:center;gap:10px;background:#fff;border-radius:20px;padding:8px 12px;margin-bottom:8px;box-shadow:0 4px 0 #cfe6c0;font-size:20px;line-height:1.4}
.ord .ue{font-size:44px}
/* 學習花園、拉霸、爸媽專區 */
.garden{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.gd{background:#f1ffe6;border-radius:18px;padding:6px 2px;box-shadow:0 4px 0 #cfe6c0;display:flex;flex-direction:column;align-items:center;font-size:14px;line-height:1.3}
.gd .ue{font-size:38px;line-height:1.2}
.bubble{position:relative;background:#fff;border-radius:20px;padding:8px 14px;font-size:20px;box-shadow:0 4px 0 #cfe6c0;min-height:44px}
.reels{display:flex;gap:10px;justify-content:center;margin:12px 0}
.reel{width:92px;height:104px;border-radius:20px;background:#fff;box-shadow:inset 0 4px 10px #0002,0 4px 0 #cfe6c0;font-size:56px;display:flex;align-items:center;justify-content:center}
.parent table{border-collapse:collapse;width:100%;font-size:17px;text-align:center}
.parent td,.parent th{padding:4px;border-bottom:2px dashed var(--pink-l)}
.parent .weak td{background:#fff0f4}
.parent textarea{width:100%;height:90px;font:14px monospace;user-select:text;-webkit-user-select:text}
.parent p{font-size:17px;font-weight:500;margin:6px 0}
/* 彈窗 / 特效 */
#mdl{position:fixed;inset:0;background:#4a3a5a88;z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#mdl.on{display:flex}
#mdlBody{max-width:560px;width:100%;max-height:88vh;overflow:auto;margin:0;animation:pop .25s}
.cheer{position:fixed;left:50%;top:36%;z-index:80;text-align:center;background:#fffbe6;border:4px solid #ffd54f;border-radius:28px;padding:16px 30px;box-shadow:0 10px 30px #0003;pointer-events:none;animation:cheerPop 2.3s ease both;max-width:86vw}
.cheer .ce{font-size:72px;line-height:1.1}.cheer .ct{font-size:30px;font-weight:700;color:#e65100}.cheer .cs{font-size:20px;color:#7a5c00}
@keyframes cheerPop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0}12%{transform:translate(-50%,-50%) scale(1.12);opacity:1}20%{transform:translate(-50%,-50%) scale(1)}85%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.stks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;text-align:center;font-size:42px}.stks .no{opacity:.3;filter:grayscale(1)}
@media(max-width:520px){.stks{grid-template-columns:repeat(4,1fr)}}
#helpbtn{position:fixed;right:10px;bottom:10px;z-index:40;width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;background:#7e57c2;color:#fff;font-size:24px;box-shadow:0 4px 0 #5e3fa0;opacity:.92}
body[data-scr=mole] #helpbtn,body[data-scr=fish] #helpbtn,body[data-scr=fruit] #helpbtn,body[data-scr=spell] #helpbtn{display:none}
.mic.on{animation:pulse 1s ease-in-out infinite;background:#ef5350;box-shadow:0 4px 0 #b71c1c}
body.talking .mascot{animation:talk .36s ease-in-out infinite}
@keyframes talk{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.1) rotate(-4deg)}}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:#5a4a63;color:#fff;padding:10px 22px;border-radius:999px;font-size:21px;z-index:70;display:none;max-width:90vw;text-align:center}
.burst{position:fixed;left:50%;top:45%;font-size:32px;pointer-events:none;z-index:60;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.4) rotate(200deg);opacity:0}}
.float{position:fixed;z-index:65;pointer-events:none;font-size:34px;animation:up 1.1s ease-out forwards}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.jump{animation:jump .7s ease}
@media (min-width:700px){.opts.chars{grid-template-columns:repeat(4,1fr)}.cards{grid-template-columns:repeat(4,1fr)}.field{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div id="view"><div style="text-align:center;padding:40px 0;font-size:28px">🌱 載入中…<div id="bootmsg" style="font:400 15px/1.6 sans-serif;margin-top:14px;white-space:pre-wrap;word-break:break-all;text-align:left;background:#fff;border-radius:12px;padding:10px">(程式還沒有執行)</div></div></div>
<div id="mdl"><div class="card" id="mdlBody"></div></div>
<div id="toast"></div>
<button id="helpbtn" data-a="help" aria-label="這裡怎麼玩">❓</button>
<script>
window.onerror=function(msg,src,line,col){var a=document.getElementById('bootmsg');if(a)a.textContent='錯誤:'+msg+'(第 '+line+' 行,第 '+col+' 字)\n'+navigator.userAgent};
</script>
<script>
(function(){
'use strict';
/* ===== 小工具 ===== */
const $=s=>document.querySelector(s);
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const HAN=/[一-鿿]/;
// 注音排版：zy('答對了','ㄉㄚˊ ㄉㄨㄟˋ ˙ㄌㄜ')，每個國字對一個注音
function zy(text,z){
  const syl=z?z.trim().split(/\s+/):[];let k=0,out='';
  for(const ch of String(text)){
    if(HAN.test(ch)&&k<syl.length){
      let s=syl[k++],light=false,tone='';
      if(s==='-'){out+=esc(ch);continue} // 「-」代表這個字不要標注音(例如題目要問的詞)
      if(s[0]==='˙'){light=true;s=s.slice(1)}
      if('ˊˇˋ'.includes(s.slice(-1))){tone=s.slice(-1);s=s.slice(0,-1)}
      out+=`<span class="zc">${ch}<span class="z">${light?'<i>˙</i>':''}${[...s].map(c=>`<i>${esc(c)}</i>`).join('')}${tone?`<b>${tone}</b>`:''}</span></span>`;
    }else out+=esc(ch);
  }
  return out;
}

歲。"},{"type":"reading","lv":"m","stem":"下列哪一句話和短文相符？","options":["弟弟比姊姊大","妹妹比弟弟小","姊姊比妹妹小"],"answer":1,"why":"妹妹三歲，弟弟五歲，所以妹妹比弟弟小。"}],"nz":true},{"id":"s2h1","title":"收衣服","text":"奶奶看著天上的烏雲，趕緊把曬在院子裡的衣服收進屋裡。不久，風越吹越大，雨點嘩啦嘩啦地落下來。","questions":[{"type":"reading","lv":"h","stem":"奶奶為什麼趕緊收衣服？","options":["她看到烏雲，覺得快要下雨了","衣服已經曬乾了","天氣變得太熱"],"answer":0,"why":"烏雲代表快下雨，後來真的下雨了。"},{"type":"reading","lv":"h","stem":"「嘩啦嘩啦」是在形容什麼？","options":["風聲","雨聲","笑聲"],"answer":1,"why":"句子是「雨點嘩啦嘩啦地落下來」，形容雨聲。"},{"type":"reading","lv":"h","stem":"這段話最適合用哪一個標題？","options":["奶奶洗衣服","院子裡的花","雨來了"],"answer":2,"why":"內容是烏雲、收衣服、下雨，主要在寫下雨前後。"}],"nz":true},{"id":"s2h2","title":"最棒的啦啦隊","text":"運動會那天，煜煜的腳受傷了，不能比賽。他坐在旁邊，把手都拍紅了，大聲替同學加油。同學們聽見了，跑得更快了。","questions":[{"type":"reading","lv":"h","stem":"「把手都拍紅了」可以看出煜煜怎麼樣？","options":["他在生氣","他非常用力地拍手加油","他的手被球打到"],"answer":1,"why":"手拍到變紅，表示很用力拍手替同學加油。"},{"type":"reading","lv":"h","stem":"替這段話取名字，哪一個最合適？","options":["最棒的啦啦隊","受傷的腳","跑得最快的人"],"answer":0,"why":"煜煜不能比賽，卻用加油幫助同學。"},{"type":"reading","lv":"h","stem":"同學們為什麼跑得更快了？","options":["比賽規則改了","天氣變涼了","聽到煜煜的加油聲，覺得受到鼓勵"],"answer":2,"why":"文中說同學聽見加油聲後跑得更快。"}],"nz":true}]},"3":{"items":[{"type":"zy2char","stem":"每天早上自己刷牙是個好〔ㄒㄧˊ ㄍㄨㄢˋ〕。選出正確的國字詞。","options":["習觀","習罐","習慣","習管"],"answer":2,"why":"「習慣」是長時間養成的做法，慣是心字旁。"},{"type":"zy2char","stem":"今天會下大雨，出門要記得帶〔ㄩˇ ㄙㄢˇ〕。選出正確的國字詞。","options":["兩傘","雨散","雨傘","雨參"],"answer":2,"why":"「雨傘」是下雨時遮雨用的，雨是下雨的「雨」，不是數字的「兩」。"},{"type":"zy2char","stem":"媽媽在廚房〔ㄓㄨˇ ㄈㄢˋ〕，滿屋子都是香味。選出正確的國字詞。","options":["者飯","煮飯","主飯","煮反"],"answer":1,"why":"用火把米弄熟叫「煮飯」，煮的下面有四點火。"},{"type":"zy2char","stem":"老師請同學們在動物園門口〔ㄐㄧˊ ㄏㄜˊ〕。選出正確的國字詞。","options":["及合","急合","集和","集合"],"answer":3,"why":"大家聚在一起叫「集合」，不是「集和」。"},{"type":"zy2char","stem":"小明很〔ㄩㄥˇ ㄍㄢˇ〕,敢自己一個人上台報告。選出正確的國字詞。","options":["湧敢","勇敢","勇趕","永敢"],"answer":1,"why":"不怕困難、敢做事叫「勇敢」。"},{"type":"zy2char","stem":"圖書館裡要保持〔ㄢ ㄐㄧㄥˋ〕,不能大聲說話。選出正確的國字詞。","options":["安靜","安淨","按靜","安爭"],"answer":0,"why":"沒有吵鬧聲叫「安靜」，靜是青字旁加爭。"},{"type":"zy2char","stem":"大家一起掃地，教室變得好〔ㄍㄢ ㄐㄧㄥˋ〕。選出正確的國字詞。","options":["幹淨","乾爭","乾淨","乾靜"],"answer":2,"why":"沒有髒東西叫「乾淨」，淨是三點水旁。"},{"type":"zy2char","stem":"颱風天晚上突然〔ㄊㄧㄥˊ ㄉㄧㄢˋ〕,爸爸趕快找出手電筒。選出正確的國字詞。","options":["亭電","停店","聽電","停電"],"answer":3,"why":"電突然沒有了叫「停電」。"},{"type":"zy2char","stem":"運動會的大隊〔ㄐㄧㄝ ㄌㄧˋ〕比賽，全班都大聲加油。選出正確的國字詞。","options":["結力","接力","接立","節力"],"answer":1,"why":"一棒接一棒的比賽叫「接力」，接是手字旁。"},{"type":"zy2char","stem":"柚子生日，同學送她一份漂亮的〔ㄌㄧˇ ㄨˋ〕。選出正確的國字詞。","options":["禮物","理物","禮務","里物"],"answer":0,"why":"送人的東西叫「禮物」，禮是示字旁。"},{"type":"zy2char","stem":"多吃青菜、多運動，身體才會〔ㄐㄧㄢˋ ㄎㄤ〕。選出正確的國字詞。","options":["建康","建庫","健庫","健康"],"answer":3,"why":"身體很好叫「健康」，健是人字旁。"},{"type":"zy2char","stem":"小明說了對不起，小美就〔ㄩㄢˊ ㄌㄧㄤˋ〕他了。選出正確的國字詞。","options":["原涼","源諒","原諒","原亮"],"answer":2,"why":"不再怪別人叫「原諒」，諒是言字旁。"},{"type":"similar","stem":"天空萬里無雲，今天是個大＿＿天，適合去公園玩。","options":["情","晴","清","請"],"answer":1,"why":"天氣好、有太陽叫「晴天」，日字旁的「晴」和太陽有關。"},{"type":"similar","stem":"老師說話很＿＿楚，大家都聽得懂。","options":["晴","情","請","清"],"answer":3,"why":"說得明白叫「清楚」，三點水旁的「清」才對。"},{"type":"similar","stem":"弟弟吃完飯，＿＿經把碗洗乾淨了。","options":["已","己","巳","以"],"answer":0,"why":"「已經」表示事情做完了，要用「已」。"},{"type":"similar","stem":"上學前，我要自＿＿整理書包。","options":["已","巳","己","以"],"answer":2,"why":"「自己」是指自身，要用「己」。"},{"type":"similar","stem":"老師講完故事，同學舉手發＿＿。","options":["間","聞","問","門"],"answer":2,"why":"提出疑問叫「發問」，要用「問」。"},{"type":"similar","stem":"教室中＿＿有一張大桌子，同學都圍著它坐。","options":["問","間","聞","開"],"answer":1,"why":"「中間」的間是門裡面有日，表示位置。"},{"type":"similar","stem":"妹妹跌倒哭了，媽媽趕快＿＿起她。","options":["抱","跑","泡","炮"],"answer":0,"why":"用手把人摟起來叫「抱」，是手字旁。"},{"type":"similar","stem":"奶奶用熱水＿＿茶給我們喝。","options":["抱","跑","炮","泡"],"answer":3,"why":"用水沖茶叫「泡茶」，泡是三點水旁。"},{"type":"similar","stem":"為了比賽，弟弟每天都很＿＿力地練習投籃。","options":["怒","努","奴","如"],"answer":1,"why":"盡力去做叫「努力」，努是力字旁。"},{"type":"similar","stem":"姊姊穿了新裙子，看起來很＿＿亮。","options":["飄","瓢","漂","票"],"answer":2,"why":"好看叫「漂亮」，漂是三點水旁。"},{"type":"similar","stem":"校車的「輪」字，部首是哪一個？","options":["亻","扌","氵","車"],"answer":3,"why":"輪子和車有關，所以部首是「車」。"},{"type":"radical","stem":"「湯」的部首是哪一個？","options":["木","火","氵","口"],"answer":2,"why":"湯跟水有關，部首是三點水「氵」。"},{"type":"measure","stem":"菜市場的阿伯送我一＿＿香蕉。","options":["隻","盞","串","封"],"answer":2,"why":"香蕉成一串一串的，用「串」最合適。"},{"type":"measure","stem":"天空飄著一＿＿白雲，像棉花糖。","options":["片","隻","本","輛"],"answer":0,"why":"雲有一片一片的樣子，用「片」。"},{"type":"measure","stem":"奶奶在市場買了一＿＿泡菜。","options":["朵","隻","罐","張"],"answer":2,"why":"裝在瓶子裡的泡菜，量詞用「罐」。"},{"type":"measure","stem":"爺爺拿起一＿＿筷子，夾了一塊魚給我。","options":["群","雙","道","首"],"answer":1,"why":"兩支成對的東西用「雙」。"},{"type":"measure","stem":"雨停了，天空出現一＿＿彩虹。","options":["道","本","雙","封"],"answer":0,"why":"彩虹像一條弧線，量詞用「道」。"},{"type":"measure","stem":"下列哪一句的量詞用錯了？","options":["奶奶遞給我一條毛巾。","公園裡開了一朵小花。","下雨天我撐著一把傘。","操場邊有一張大樹。"],"answer":3,"why":"樹要用「棵」，不能說「一張大樹」。"},{"type":"wordmean","stem":"週末的夜市很「熱鬧」，到了深夜攤販都收了，變得很＿＿。請選出「熱鬧」的反義詞。","options":["吵鬧","冷清","擁擠","快樂"],"answer":1,"why":"「熱鬧」的反義詞是「冷清」，指人少又安靜。"},{"type":"wordmean","stem":"哥哥敢自己走夜路，很勇敢；弟弟怕黑不敢出門，很＿＿。請選出「勇敢」的反義詞。","options":["膽小","害羞","安靜","生氣"],"answer":0,"why":"「勇敢」的反義詞是「膽小」，害怕不敢做事。"},{"type":"wordmean","stem":"校車到站了，煜煜「立刻」跑上車。下列哪一個詞和「立刻」意思最接近？","options":["慢慢","偶爾","馬上","終於"],"answer":2,"why":"「立刻」和「馬上」都是一下子就做的意思。"},{"type":"wordmean","stem":"爺爺很「愛護」他種的花。下列哪一個詞和「愛護」意思最接近？","options":["忘記","討厭","丟掉","珍惜"],"answer":3,"why":"「愛護」和「珍惜」都是很重視、好好保護的意思。"},{"type":"wordmean","stem":"爺爺說，走路時要抬頭挺胸。請選出「抬頭」的反義詞。","options":["回頭","點頭","低頭","搖頭"],"answer":2,"why":"「抬頭」是把頭抬起來，反義詞是把頭垂下來的「低頭」。"},{"type":"wordmean","stem":"小美不小心打破花瓶，她馬上告訴老師。下列哪一個詞最適合稱讚她？","options":["誠實","驕傲","小氣","懶惰"],"answer":0,"why":"主動說出自己的錯，是「誠實」的表現，這是稱讚人的好詞。"},{"type":"wordmean","stem":"弟弟對這道題目很「疑惑」，不知道怎麼做。下列哪一個詞和「疑惑」意思最接近？","options":["開心","困惑","放心","相信"],"answer":1,"why":"「疑惑」和「困惑」都是心裡不明白、不確定的意思。"},{"type":"wordmean","stem":"奶奶把水果分給大家，她很大方；阿福捨不得分一顆糖，他很＿＿。請選出「大方」的反義詞。","options":["謙虛","勤勞","小氣","安靜"],"answer":2,"why":"「大方」的反義詞是「小氣」，捨不得和別人分享。"},{"type":"wordmean","stem":"小明「仔細」檢查書包，怕忘了帶課本。下列哪一個詞和「仔細」意思最接近？","options":["匆忙","認真","隨便","粗心"],"answer":1,"why":"「仔細」和「認真」都是用心、不馬虎的意思。"},{"type":"wordmean","stem":"喬妹是個很「活潑」的小孩。請選出「活潑」的反義詞。","options":["熱鬧","勇敢","開朗","文靜"],"answer":3,"why":"「活潑」是愛玩愛動，反義詞是安安靜靜的「文靜」。"},{"type":"rhetoric","stem":"「校車停在路邊，像一隻黃色的大甲蟲。」這句話用了哪一種修辭？","options":["譬喻","擬人","排比","設問"],"answer":0,"why":"用「像」把校車比成大甲蟲，是譬喻。"},{"type":"rhetoric","stem":"「風推著我的背，催我快點走去校車站。」這句話用了哪一種修辭？","options":["譬喻","擬人","設問","排比"],"answer":1,"why":"把風當成人，有推背、催促的動作，是擬人。"},{"type":"rhetoric","stem":"「媽媽的手粗粗的、暖暖的，牽著我過馬路。」這句話用了哪一種修辭？","options":["譬喻","設問","類疊","擬人"],"answer":2,"why":"「粗粗」「暖暖」是疊字詞，是類疊。"},{"type":"rhetoric","stem":"「春天有花香，夏天有蟬聲，秋天有落葉，冬天有暖陽。」這段話用了哪一種修辭？","options":["譬喻","擬人","設問","排比"],"answer":3,"why":"連續幾句結構相似，是排比。"},{"type":"rhetoric","stem":"「你知道誰最早到校嗎？是每天開門的警衛伯伯。」這句話用了哪一種修辭？","options":["排比","設問","擬人","譬喻"],"answer":1,"why":"先問問題再自己回答，是設問。"},{"type":"rhetoric","stem":"「煜煜的臉紅得彷彿熟透的蘋果。」這句話用了哪一種修辭？","options":["排比","設問","譬喻","擬人"],"answer":2,"why":"用「彷彿」把臉比成蘋果，是譬喻。"},{"type":"rhetoric","stem":"「月亮像一個大銀盤掛在天上。」句中哪一個字是比喻的關鍵字？","options":["像","大","掛","月"],"answer":0,"why":"「像」連接月亮和銀盤，是譬喻的關鍵字。"},{"type":"rhetoric","stem":"下列哪一句話用了擬人？","options":["雲朵像一團棉花糖","你知道誰最愛笑嗎？是我的弟弟","彎彎的月亮掛在天上","小草在風中點頭問好"],"answer":3,"why":"小草會點頭問好，把草當成人，是擬人。"},{"type":"rhetoric","stem":"想把「弟弟的臉很紅」改成譬喻句，下列哪一句最正確？","options":["弟弟的臉紅得像熟透的蘋果","弟弟的臉在向大家問好","弟弟的臉紅紅的","弟弟的臉為什麼紅？因為他害羞"],"answer":0,"why":"用「像」把臉比成蘋果才是譬喻句。"},{"type":"rhetoric","stem":"「小鳥在樹上唱著歌歡迎我們。」這句話是怎麼寫的？","options":["把小鳥比成別的東西","自己問再自己答","把小鳥當成人來寫","三句結構相似"],"answer":2,"why":"小鳥會唱歌歡迎人，是把小鳥當成人來寫的擬人。"},{"type":"pattern","stem":"＿＿今天下大雨，＿＿校車比平常慢了十分鐘。","options":["雖然……但是……","如果……就……","因為……所以……","不但……而且……"],"answer":2,"why":"前面是原因，後面是結果，要用「因為……所以……」。"},{"type":"pattern","stem":"＿＿天氣很冷，＿＿同學們還是在操場上開心地跑步。","options":["雖然……但是……","因為……所以……","如果……就……","不但……而且……"],"answer":0,"why":"前後意思相反，要用「雖然……但是……」。"},{"type":"pattern","stem":"阿姨做的蛋餅＿＿好吃，＿＿很便宜。","options":["因為……所以……","雖然……但是……","如果……就……","不但……而且……"],"answer":3,"why":"兩個優點一層一層加上去，用「不但……而且……」。"},{"type":"pattern","stem":"＿＿明天放晴，我們＿＿去公園野餐。","options":["雖然……但是……","如果……就……","不但……而且……","因為……所以……"],"answer":1,"why":"還沒發生的條件和結果，用「如果……就……」。"},{"type":"pattern","stem":"爺爺＿＿喝茶，＿＿看報紙。","options":["因為……所以……","雖然……但是……","一邊……一邊……","如果……就……"],"answer":2,"why":"兩件事同時做，用「一邊……一邊……」。"},{"type":"pattern","stem":"把「柚子很喜歡吃青菜」改成否定句，下列哪一句正確？","options":["柚子不喜歡吃青菜","柚子喜歡吃青菜嗎","柚子沒有不喜歡吃青菜","柚子真喜歡吃青菜啊"],"answer":0,"why":"否定句要說成「不喜歡」，意思和原句相反。"},{"type":"pattern","stem":"把「小明昨天去圖書館借書。」改成疑問句，下列哪一句正確？","options":["小明昨天不去圖書館借書","昨天小明去圖書館借書真好","小明昨天去圖書館借書，真是太好了","小明昨天去圖書館借書嗎"],"answer":3,"why":"句尾加上「嗎」，就變成問句。"},{"type":"pattern","stem":"＿＿是晴天還是雨天，爺爺＿＿會準時到公園運動。","options":["雖然……但是……","不管……都……","不但……而且……","因為……所以……"],"answer":1,"why":"不受天氣影響，結果都一樣，用「不管……都……」。"},{"type":"punct","stem":"早餐店阿姨問：「你要吃蛋餅還是吃饅頭＿＿」括號處該用哪一個標點符號？","options":["？","、","。","！"],"answer":0,"why":"這是一句詢問的話，句尾要用問號「？」。"},{"type":"punct","stem":"校車快要開走了，煜煜大聲喊：「等一等我＿＿」空格應填哪一個標點符號？","options":["。","，","、","！"],"answer":3,"why":"煜煜大聲呼喊，語氣很急，句尾要用驚嘆號「！」。"},{"type":"punct","stem":"阿姨在菜市場買了高麗菜＿＿番茄和青椒。空格應填哪一個標點符號？","options":["？","！","、","："],"answer":2,"why":"高麗菜、番茄、青椒是並列的詞語，中間用頓號「、」。"},{"type":"punct","stem":"爺爺笑著對我說＿＿「天氣變冷了，要多穿一件衣服。」空格應填什麼？","options":["：","。","、","？"],"answer":0,"why":"引用別人說的話之前，要先用冒號「：」，再加上引號。"},{"type":"punct","stem":"下列哪一個句子的標點符號使用正確？","options":["你今天為什麼遲到。","我喜歡蘋果，香蕉，和葡萄！","哇，好大的西瓜？","媽媽說：「明天要帶水壺。」"],"answer":3,"why":"媽媽說的話前面用冒號，話放進引號裡，標點正確；其他三句的句尾或停頓用錯了。"},{"type":"punct","stem":"我在圖書館借了一本故事書，書名叫小王子。書名要用哪一種符號標出來？","options":["（　）","《　》","……","、"],"answer":1,"why":"書名要用書名號《　》標示。"},{"type":"punct","stem":"下列句子中，哪一個標點符號用錯了？","options":["奶奶問：「你吃飽了嗎？」","雨一直下，我們不能去公園？","今天的天氣真好啊！","弟弟說：「我想吃草莓。」"],"answer":1,"why":"「雨一直下，我們不能去公園」是敘述句，句尾應該用句號，不能用問號。"},{"type":"punct","stem":"雖然下著大雨＿＿我們還是準時到學校。空格應填哪一個標點符號？","options":["。","？","，","！"],"answer":2,"why":"句子的意思還沒說完，中間停一下要用逗號「，」。"},{"type":"order","stem":"把詞語排成一句話","words":["放學後","我和同學","一起","在操場","打球"],"accept":["放學後我和同學一起在操場打球","我和同學放學後一起在操場打球","放學後我和同學在操場一起打球","我和同學放學後在操場一起打球"],"why":"放學後我和同學一起在操場打球。"},{"type":"order","stem":"把詞語 持續」是一直不中斷，和「繼續」意思最接近；「重複」是再做一次。"},{"type":"synonym","lv":"m","stem":"弟弟不小心把玩具車「損壞」了。下列哪一個詞和「損壞」意思最接近？","options":["修補","毀壞","弄丟","保養"],"answer":1,"why":"「損壞」和「毀壞」都是東西壞掉；「弄丟」是不見了。"},{"type":"antonym","lv":"m","stem":"「鮮豔」的反義詞是哪一個？","options":["豔麗","耀眼","黯淡","繽紛"],"answer":2,"why":"鮮豔是顏色明亮好看，反義詞是黯淡；其他三個都和鮮豔相近。"},{"type":"antonym","lv":"m","stem":"「潮溼」的反義詞是哪一個？","options":["悶熱","寒冷","清涼","乾燥"],"answer":3,"why":"潮溼是水氣多，相反的是乾燥。"},{"type":"measure","lv":"m","stem":"河岸邊有一＿＿柳樹，長長的枝條垂到水面上。","options":["條","根","枝","棵"],"answer":3,"why":"樹木的量詞用「棵」，「條」「根」「枝」都不適合用來數整棵樹。"},{"type":"measure","lv":"m","stem":"湖面上有一＿＿小舟，慢慢地划向對岸。","options":["艘","輛","架","座"],"answer":0,"why":"船的量詞是「艘」，輛是車，架是飛機，座是山或建築。"},{"type":"punct","lv":"m","stem":"弟弟問＿＿「你吃飽了嗎＿＿」兩個空格依序應填哪一組符號？","options":["：　？","，　。","：　。","、　！"],"answer":0,"why":"引用別人說的話，前面用冒號；這句話是問句，問號放在引號裡面：弟弟問：「你吃飽了嗎？」"},{"type":"punct","lv":"m","stem":"他的外號叫＿＿小飛俠＿＿，跑得非常快。兩個空格應填哪一組符號，用來標出外號？","options":["「　」","《　》","（　）","——　——"],"answer":0,"why":"特別的稱呼、外號用引號「　」標示；書名號《　》用在書名。"},{"type":"pattern","lv":"m","stem":"弟弟打破了杯子，不但沒有道歉，＿＿怪起妹妹來。","options":["反而","於是","所以","免得"],"answer":0,"why":"「不但沒有……反而……」表示結果和預期相反，只有「反而」最通順。"},{"type":"pattern","lv":"m","stem":"這道菜＿＿用肉做的，＿＿用香菇做的。","options":["不是……而是……","不但……而且……","雖然……但是……","因為……所以……"],"answer":0,"why":"否定前者、肯定後者，要用「不是……而是……」。"},{"type":"pattern","lv":"m","stem":"把「哥哥把風箏放上天空」改成「被」字句，下列哪一句最正確？","options":["哥哥被風箏放上天空。","被哥哥風箏放上天空。","風箏把哥哥放上天空。","風箏被哥哥放上天空。"],"answer":3,"why":"被字句要把承受動作的風箏放在前面：風箏被哥哥放上天空。"},{"type":"order","lv":"m","stem":"把詞語排成一句話","words":["放學後","煜煜","撿到","一隻小鳥","它","受傷了"],"accept":["放學後煜煜撿到一隻小鳥，它受傷了。","煜煜放學後撿到一隻小鳥，它受傷了。","一隻小鳥受傷了，放學後煜煜撿到它。","一隻小鳥受傷了，煜煜放學後撿到它。"],"why":"標準答案：放學後煜煜撿到一隻小鳥，它受傷了。「它」指前面的小鳥。"},{"type":"order","lv":"m","stem":"把詞語排成一句話","words":["媽媽先","把蛋打進碗裡","再用筷子攪勻","最後倒進熱鍋煎熟"],"accept":["媽媽先把蛋打進碗裡，再用筷子攪勻，最後倒進熱鍋煎熟。"],"why":"標準答案：媽媽先把蛋打進碗裡，再用筷子攪勻，最後倒進熱鍋煎熟。依先、再、最後的順序。"},{"type":"rhetoric","lv":"m","stem":"下列哪一句用了排比？","options":["有的同學在跑步，有的同學在跳繩，有的同學在盪鞦韆。","蝴蝶飛啊飛，飛過了小河。","秋天的楓葉像一把把小紅傘。","到底誰才是班上的大力士呢？答案就是我們的班長。"],"answer":0,"why":"三個結構相似的句子連在一起，是排比；第二句是類疊，第三句是譬喻，第四句是設問。"},{"type":"rhetoric","lv":"m","stem":"下列哪一句用了類疊（把相同的字詞重複使用）？","options":["小河嘩啦嘩啦地流著。","太陽像一顆大火球。","雲朵在天空中散步。","這是誰的帽子？是弟弟的。"],"answer":0,"why":"「嘩啦嘩啦」是相同詞語重複，屬於類疊；第二句是譬喻，第三句是擬人，第四句是設問。"},{"type":"meaning","lv":"m","stem":"下列哪一句話中，成語「津津有味」用得最恰當？","options":["他一口也吃不下，津津有味地看著菜。","弟弟拿著故事書，津津有味地讀個不停。","考試前一晚，我津津有味地擔心。","大雨津津有味地下著。"],"answer":1,"why":"津津有味是興趣濃厚、很有滋味，只有讀故事書讀個不停最合適。"},{"type":"meaning","lv":"m","stem":"學游泳才三天，弟弟就說太累而不學了。這種做事沒有恆心、中途放棄的情形，可以用哪一個成語形容？","options":["持之以恆","半途而廢","一氣呵成","堅持不懈"],"answer":1,"why":"半途而廢是事情做到一半就放棄；其他三個都是堅持到底的意思。"},{"type":"radical","lv":"m","stem":"「藏」的部首是哪一個？","options":["臣","戈","艹","爿"],"answer":2,"why":"「藏」是草字頭（艹），其他是字裡的部件。"},{"type":"radical","lv":"m","stem":"「狼」的部首是哪一個？","options":["艮","犭","氵","彳"],"answer":1,"why":"狼是動物，部首是犭（犬部）。"},{"type":"zy2char","lv":"h","stem":"多吃蔬菜水果，身體才能得到足夠的〔ㄧㄥˊ ㄧㄤˇ〕。選出正確的國字詞。","options":["營養","榮養","營癢","螢養"],"answer":0,"why":"身體需要的養分叫「營養」，營是經營的營。"},{"type":"zy2char","lv":"h","stem":"班上舉辦愛心活動，同學們把零用錢拿來〔ㄐㄩㄢ ㄎㄨㄢˇ〕。選出正確的國字詞。","options":["損款","捐款","娟款","指款"],"answer":1,"why":"拿出錢來幫助別人叫「捐款」，「損」是損壞。"},{"type":"similar","lv":"h","stem":"這本書的內容十分豐＿＿，我每一頁都看得很入迷。","options":["副","福","富","幅"],"answer":2,"why":"「豐富」是很多、不缺乏的意思，用「富」。"},{"type":"similar","lv":"h","stem":"從這裡到外婆家的路途十分＿＿遠，要坐很久的車。","options":["遙","搖","謠","姚"],"answer":0,"why":"「遙遠」是距離很遠，走之旁和路途有關。"},{"type":"poly","lv":"h","hide":"行","stem":"下列哪一句話中「行」的讀音，和其他三句不同？","options":["爸爸在銀行排隊領錢。","弟弟的行為很有禮貌。","暑假我們全家去旅行。","這條路行不通，要換一條。"],"answer":0,"why":"「銀行」的行讀ㄏㄤˊ，其他三句都讀ㄒㄧㄥˊ。"},{"type":"poly","lv":"h","hide":"重","stem":"下列哪一句話中的「重」，要讀作ㄔㄨㄥˊ？","options":["這袋米好重，我提不動。","請把這句話重寫一次。","媽媽很重視我的功課。","他的病情很嚴重。"],"answer":1,"why":"「重寫」是再寫一次，重讀ㄔㄨㄥˊ；其他三句讀ㄓㄨㄥˋ。"},{"type":"poly","lv":"h","hide":"得","stem":"下列哪一句話中的「得」，要讀作ㄉㄜˇ（必須）？","options":["他跑得比我快。","小美得到第一名。","我記得帶水壺了。","天快黑了，我得趕快回家。"],"answer":3,"why":"「我得趕快回家」的得是「必須」的意思，讀ㄉㄜˇ。"},{"type":"fixerr","lv":"h","stem":"描寫天氣和風景時，下列哪一個詞語的國字寫錯了？","options":["情朗","圓滿","青翠","綻放"],"answer":0,"why":"天氣好應寫成「晴朗」，不是「情朗」。"},{"type":"fixerr","lv":"h","stem":"形容人的動作和技藝時，下面哪一個成語的國字寫錯了？","options":["手忙腳亂","一馬當先","出神入化","鬼斧神功"],"answer":3,"why":"正確是「鬼斧神工」，工是工藝的工。"},{"type":"fixerr","lv":"h","stem":"寫作文時要小心用字，下列哪一個詞語的國字寫錯了？","options":["機會","幾續","幼稚","幻想"],"answer":1,"why":"一直做下去是「繼續」，不是「幾續」。"},{"type":"cloze","lv":"h","stem":"接力賽的槍聲一響，小美＿＿，第一個衝了出去。","options":["手忙腳亂","霧裡看花","出神入化","一馬當先"],"answer":3,"why":"「一馬當先」是衝在最前面，最符合第一個衝出去。"},{"type":"cloze","lv":"h","stem":"風和雨水把山壁雕成各種奇特的形狀，真是＿＿。","options":["鬼斧神工","霧裡看花","手忙腳亂","一馬當先"],"answer":0,"why":"「鬼斧神工」形容自然景物像神仙雕成，奇妙非凡。"},{"type":"parts","lv":"h","stem":"「木」加上「卯」，合起來是哪一個字？","options":["仰","抑","劉","柳"],"answer":3,"why":"木加卯是「柳」，如柳樹。"},{"type":"parts","lv":"h","stem":"「衤」加上「甫」，合起來是哪一個字？","options":["補","捕","哺","浦"],"answer":0,"why":"衣字旁加甫是「補」，如補衣服；捕是提手旁。"},{"type":"dialog","lv":"h","stem":"小美對小明說：「對不起，我不小心把你的鉛筆盒摔壞了。」小明最適合怎麼回答？","options":["太好了，我正想換新的！","你真粗心，我不想理你了！","那是爸爸買的，你要賠給我。","沒關係，我知道你不是故意的。"],"answer":3,"why":"對方道歉時，用體諒的話回應最恰當。"},{"type":"dialog","lv":"h","stem":"小明想向老師借剪刀，下列哪一句話最有禮貌？","options":["剪刀給我，我要用！","老師，請問可以借我剪刀嗎？","你的剪刀借我一下。","快把剪刀拿過來！"],"answer":1,"why":"稱呼老師並用「請問」詢問，語氣最有禮貌。"},{"type":"meaning","lv":"h","stem":"「前面的路在施工，我們只好繞道而行。」句中的「繞道而行」是什麼意思？","options":["沿著路邊慢慢走","直接穿過工地","改走另一條較遠的路","在原地等到施工結束"],"answer":2,"why":"繞道是避開原來的路，改走別條路。"},{"type":"meaning","lv":"h","stem":"「兩位好朋友並肩走在河堤上。」句中的「並肩」是什麼意思？","options":["一前一後地跟著走","肩膀靠著肩膀並排走","背著書包一起走","互相追逐著跑"],"answer":1,"why":"並肩是兩人並排在一起。"},{"type":"pattern","lv":"h","stem":"出門前先把雨傘放進書包，＿＿突然下雨淋溼了。","options":["何況","除非","免得","甚至"],"answer":2,"why":"「免得」表示預先防止不好的事發生，前後語意最順。"},{"type":"pattern","lv":"h","stem":"這件事＿＿看起來很簡單，＿＿做起來並不容易。","options":["不但……還……","如果……就……","雖然……可是……","只有……才……"],"answer":2,"why":"前面說簡單，後面說不容易，意思轉折，要用「雖然……可是……」。"},{"type":"order","lv":"h","stem":"把詞語排成一句話","words":["太陽下山後","晚霞","把","天邊","染紅了"],"accept":["太陽下山後，晚霞把天邊染紅了。"],"why":"標準答案：太陽下山後，晚霞把天邊染紅了。"},{"type":"order","lv":"h","stem":"把詞語排成一句話","words":["只有","多閱讀","才能","寫出","好文章"],"accept":["只有多閱讀，才能寫出好文章。"],"why":"標準答案：只有多閱讀，才能寫出好文章。"},{"type":"rhetoric","lv":"h","stem":"下列哪一句話有「像」字，卻不是譬喻？","options":["夕陽像一顆紅透的柿子","弟弟長得像爸爸","飛機像一隻大鳥飛過天空","小河像一條銀色的帶子"],"answer":1,"why":"「弟弟長得像爸爸」是說兩人相似，並沒有把一個東西比成另一個東西。"},{"type":"rhetoric","lv":"h","stem":"「為什麼天空是藍色的呢？因為陽光裡的藍光最容易被空氣散開。」這段話用了哪一種修辭？","options":["譬喻","擬人","排比","設問"],"answer":3,"why":"先提出問題，再自己回答，是設問。"},{"type":"punct","lv":"h","stem":"春天，花兒開了＿＿夏天，蟬兒叫了＿＿秋天，葉子黃了。兩個空格要填同一個標點符號，應該填哪一個？","options":["、","？","：","；"],"answer":3,"why":"幾個意思並列、結構相似的句子之間，可以用分號「；」隔開。"},{"type":"punct","lv":"h","stem":"小明＿＿我最好的朋友＿＿昨天轉學了。兩個空格要填同一個符號來補充說明小明是誰，應該填哪一個？","options":["——","……","：","、"],"answer":0,"why":"補充說明句子中的人或事，用破折號「——」。"},{"type":"synonym","lv":"h","stem":"「障礙」的意思和哪一個詞最接近？","options":["阻礙","幫助","保護","方便"],"answer":0,"why":"障礙和阻礙都是擋住、使事情不順利。"},{"type":"antonym","lv":"h","stem":"「團結」的反義詞是哪一個？","options":["合作","分裂","集合","友愛"],"answer":1,"why":"團結是大家一條心，相反的是分裂。"}],"passages":[{"id":"r1","title":"市場裡的橘子","text":"週末早上，煜煜跟著爸爸到菜市場買菜。市場裡人來人往，非常熱鬧。走到轉角時，一陣大風吹來，賣青菜的阿婆的菜攤歪了，青菜滾了一地。阿婆急得手忙腳亂，不知道該先撿哪一樣。煜煜看見了，立刻放下手中的袋子跑過去，一棵一棵地把青菜撿起來，放回籃子裡。爸爸也走過來，幫忙把菜攤扶正。阿婆笑瞇瞇地說：「謝謝你們！這顆橘子送給你，請你吃吃看。」煜煜開心地收下橘子，心裡暖暖的。回家的路上，爸爸說：「幫助別人，自己也會很快樂。」","questions":[{"type":"reading","stem":"阿婆的菜攤為什麼會歪掉？","options":["地板太滑了","一陣大風吹來","客人擠得太多","阿婆沒有站好"],"answer":1,"why":"短文說「一陣大風吹來，賣青菜的阿婆的菜攤歪了」。"},{"type":"reading","stem":"阿婆「急得手忙腳亂」，最可能的原因是什麼？","options":["青菜滾了一地，不知道先撿哪一樣","她想要早點回家","煜煜把袋子弄丟了","她找不到橘子"],"answer":0,"why":"青菜滾了一地，阿婆不知道該先撿哪一樣，所以才會慌亂。"},{"type":"reading","stem":"煜煜為什麼覺得心裡暖暖的？","options":["因為天氣很熱","因為他買到便宜的青菜","因為爸爸買了橘子給他","因為他幫助了阿婆，也得到感謝"],"answer":3,"why":"煜煜幫忙撿青菜，阿婆向他道謝並送橘子，所以他心裡暖暖的。"},{"type":"reading","stem":"爸爸最後說的話，想告訴煜煜什麼道理？","options":["買菜要帶袋子","市場的東西很便宜","幫助別人，自己也會很快樂","週末要早起"],"answer":2,"why":"爸爸說「幫助別人，自己也會很快樂」，就是這個道理。"}]},{"id":"r2","title":"颱風來了怎麼辦","text":"颱風來臨前，家裡要先做好準備，才能平安度過。首先，要把陽台上的花盆和雨具搬進屋內，避免被強風吹落，砸傷路人。其次，要檢查家裡有沒有手電筒和電池，因為颱風天可能會停電。第三，要準備足夠的飲用水，和不用加熱就能吃的食物，像是餅乾和麵包。最後，要記得關緊門窗。颱風來的時候，大家最好待在家裡，不要到海邊或溪邊玩，才不會發生危險。只要事先做好準備，就能安心等颱風離開。","questions":[{"type":"reading","stem":"為什麼要檢查家裡有沒有手電筒和電池？","options":["晚上要出門散步","電視一定要用電池","颱風天可能會停電","要送給鄰居"],"answer":2,"why":"短文說「颱風天可能會停電」，所以要準備手電筒和電池。"},{"type":"reading","stem":"依照短文的順序，第三件要做的事是什麼？","options":["關緊門窗","檢查手電筒和電池","把花盆搬進屋內","準備飲用水和不用加熱的食物"],"answer":3,"why":"短文依序寫首先、其次、第三、最後，第三項是準備飲用水和不用加熱的食物。"},{"type":"reading","stem":"這篇短文主要在說明什麼？","options":["颱風來臨前要做哪些準備","颱風是怎麼形成的","颱風天可以去哪裡玩","怎樣在家裡煮好吃的菜"],"answer":0,"why":"全文列出颱風來臨前要做的準備，所以主旨是颱風來臨前的準備。"},{"type":"reading","stem":"如果颱風天停電了，下列哪一種食物最適合當晚餐？","options":["熱騰騰的火鍋","麵包和餅乾","現煮的麵條","剛炸好的雞排"],"answer":1,"why":"停電不能加熱，短文建議準備不用加熱就能吃的餅乾和麵包。"}]},{"id":"r3","title":"下雨天","text":"〈下雨天〉\n嘩啦嘩啦，雨姊姊來了，\n她敲著窗戶說：「我來了，我來了！」\n小水窪張開大嘴巴，\n把天空的雲朵吃進肚子裡。\n雨傘像一朵朵彩色的花，\n在街道上輕輕地開放。\n我穿上黃色的雨鞋，\n踩著水窪跳啊跳，\n雨聲也跟著我唱歌，\n下雨天，真快樂！","questions":[{"type":"reading","stem":"詩中說雨傘像什麼？","options":["彩色的氣球","黃色的雨鞋","小水窪","一朵朵彩色的花"],"answer":3,"why":"詩中寫「雨傘像一朵朵彩色的花」。"},{"type":"reading","stem":"「小水窪張開大嘴巴，把天空的雲朵吃進肚子裡。」用了什麼修辭？","options":["設問","排比","擬人","類疊"],"answer":2,"why":"把小水窪當成人，有嘴巴還會吃東西，所以是擬人。"},{"type":"reading","stem":"作者「踩著水窪跳啊跳」，表示他當時的心情如何？","options":["很生氣","很開心","很害怕","很無聊"],"answer":1,"why":"他一邊跳一邊聽雨聲唱歌，最後還說「真快樂」，可見很開心。"},{"type":"reading","stem":"詩中的「雨姊姊」指的是什麼？","options":["從天上落下來的雨","住在隔壁的姊姊","穿雨衣的同學","窗外的小鳥"],"answer":0,"why":"詩人把下雨當成雨姊姊來敲窗，是用擬人的寫法。"}]},{"id":"r4","title":"給柚子的一封信","text":"親愛的柚子：\n你好嗎？昨天下課時，我在操場上不小心把球打到你的頭，你一定很痛，我卻只顧著和同學玩，沒有立刻向你道歉，還對你大聲說「走開」。回到家後，我越想越難過，我知道自己做錯了。對不起！你願意原諒我嗎？明天早上，我會帶你最愛吃的草莓餅乾到學校，希望我們可以像以前一樣，一起玩跳繩。\n祝你\n天天開心\n你的朋友　喬妹\n十月二十八日","questions":[{"type":"reading","stem":"這封信是誰寫給誰的？","options":["喬妹寫給柚子","柚子寫給喬妹","柚子寫給老師","喬妹寫給老師"],"answer":0,"why":"信的開頭稱呼「柚子」，最後署名「喬妹」，所以是喬妹寫給柚子。"},{"type":"reading","stem":"喬妹為什麼要寫這封信？","options":["想邀請柚子參加生日會","想借柚子的跳繩","為了昨天的事向柚子道歉","想告訴柚子明天要考試"],"answer":2,"why":"喬妹把球打到柚子，又沒有立刻道歉，所以寫信說對不起。"},{"type":"reading","stem":"喬妹打算怎麼表達自己的誠意？","options":["借柚子一枝筆","請老師處罰自己","再寫第二封信","帶柚子愛吃的草莓餅乾"],"answer":3,"why":"信中說明天會帶柚子最愛吃的草莓餅乾到學校。"},{"type":"reading","stem":"信中的「祝你天天開心」，屬於書信格式的哪一部分？","options":["稱呼","祝福語","署名","日期"],"answer":1,"why":"信末表示祝福的話叫作祝福語。"}]},{"id":"g3m1","title":"會發芽的豆子","text":"煜煜在陽台的小花盆裡種了一顆豆子，他每天早上都幫豆子澆水，還把花盆搬到太陽底下。可是過了一個星期，泥土裡還是靜悄悄的，什麼也沒有長出來。煜煜著急地說：「是不是壞掉了？」奶奶笑著說：「種子需要時間，你要有耐心。」又過了三天，一個清晨，煜煜發現泥土裡鑽出了一小片嫩綠的芽，像一個害羞的小娃娃，正探頭看著世界。他高興得跳了起來，大聲說：「它醒過來了！」從那天起，煜煜明白了一件事：好事情常常需要慢慢等待，只要不放棄，一定會有收穫。","questions":[{"type":"reading","lv":"m","stem":"煜煜每天早上為豆子做了什麼事？","options":["澆水，並把花盆搬到太陽底下","幫豆子施肥","對著豆子唱歌","幫豆子換新花盆"],"answer":0,"why":"文中說他每天早上幫豆子澆水，還把花盆搬到太陽底下。"},{"type":"reading","lv":"m","stem":"奶奶為什麼說「你要有耐心」？","options":["因為豆子已經壞掉了","因為種子發芽需要時間","因為煜煜澆水太少","因為花盆太小了"],"answer":1,"why":"奶奶是要煜煜明白種子發芽需要時間，要慢慢等。"},{"type":"reading","lv":"m","stem":"「像一個害羞的小娃娃」這句話用了哪一種修辭？","options":["排比","設問","譬喻","誇飾"],"answer":2,"why":"把嫩芽比成小娃娃，用「像」連接，是譬喻。"}]},{"id":"g3h1","title":"螞蟻搬家","text":"放學後，小明和煜煜在校園角落發現一長排螞蟻。牠們排成整齊的隊伍，搬著白色的小顆粒，往同一個方向前進。煜煜好奇地問：「螞蟻是不是在逃難？」小明抬頭望了望天空，烏雲正慢慢聚攏。他想起老師說過，螞蟻對濕氣特別敏感，下雨前空氣變得潮濕，牠們就會趕緊把卵和食物搬到高處，免得被雨水淹沒。兩人決定回教室拿雨傘。果然，才走到一半，大雨就嘩啦嘩啦地落下來了。煜煜佩服地說：「原來小動物也是天氣預報員！」小明點點頭，心想大自然裡一定還有許多有趣的祕密，等著他們慢慢去發現。","questions":[{"type":"reading","lv":"h","stem":"螞蟻為什麼要把卵和食物搬到高處？","options":["想換一個風景更好的新家","感覺到空氣潮濕，怕被雨水淹沒","天氣太熱，想到高處乘涼","正在和煜煜玩遊戲"],"answer":1,"why":"短文說下雨前空氣潮濕，螞蟻搬到高處是免得被雨水淹沒。"},{"type":"reading","lv":"h","stem":"下列哪一項敘述符合短文的內容？","options":["螞蟻排隊是為了找水喝","煜煜早就知道螞蟻能預測下雨","小明想起老師說過的話，猜到快下雨了","兩人回到教室後，才開始下雨"],"answer":2,"why":"小明是想起老師的話，才推測螞蟻搬家和下雨有關。"},{"type":"reading","lv":"h","stem":"這篇短文最適合的標題是哪一個？","options":["校園裡的運動會","煜煜忘記帶雨傘","認識螞蟻的種類","螞蟻搬家預告下雨"],"answer":3,"why":"全文都在說螞蟻搬家，結果真的下大雨，主旨是螞蟻搬家預告下雨。"}]},{"id":"g3ma","title":"社區植樹日","text":"星期六早上，社區舉辦植樹活動，煜煜和爸爸也來幫忙。管理員伯伯先教大家怎麼挖坑：坑要挖得夠深，樹苗的根才有地方伸展。接著，大家把樹苗輕輕放進坑裡，再一鏟一鏟地把泥土蓋回去，最後還要澆上足夠的水。煜煜發現，每棵樹苗旁邊都插著一根竹竿，就問伯伯：「為什麼要綁竹竿呢？」伯伯笑著說：「小樹還很瘦弱，風一大就會吹歪，有竹竿扶著，它才能站得直。」煜煜看著排得整整齊齊的小樹苗，開心地說：「等它們長大，這裡就有涼爽的樹蔭了！」","questions":[{"type":"reading","lv":"m","stem":"伯伯說坑要挖得夠深，是為了什麼？","options":["讓泥土比較好蓋","讓水不會流走","讓樹根有地方伸展","讓樹苗長得比較快"],"answer":2,"why":"短文說：坑要挖得夠深，樹苗的根才有地方伸展。"},{"type":"reading","lv":"m","stem":"每棵樹苗旁邊為什麼要綁上竹竿？","options":["讓大家分辨樹的種類","讓小鳥可以停在上面","讓澆水時比較方便","讓小樹不容易被風吹歪"],"answer":3,"why":"小樹瘦弱，風一大就會吹歪，竹竿可以扶著它站直。"},{"type":"reading","lv":"m","stem":"這篇短文主要在說什麼？","options":["介紹竹竿有哪些不同用途","社區舉辦植樹活動，學習如何種樹","煜煜和爸爸週末到山上爬山","管理員伯伯每天辛苦的工作"],"answer":1,"why":"全文從挖坑、放樹苗到綁竹竿，說的是植樹活動的過程。"}]},{"id":"g3mb","title":"荷葉的秘密","text":"下過雨後，小美在池塘邊發現一件奇怪的事：荷葉上的雨水不會散開，反而聚成一顆顆圓滾滾的水珠，像一粒粒透明的珍珠，在葉面上滾來滾去。她好奇地問老師：「荷葉是不是塗了什麼東西？」老師帶她用放大鏡觀察，只見葉面布滿細小的突起，上面還有一層薄薄的蠟。老師解釋說，水碰到這些突起，沒辦法平平地貼在葉面上，只好縮成小水珠，順著葉面滑落，同時也把灰塵一起帶走。所以荷葉總是乾淨清爽。小美說：「原來荷葉有自己的洗澡方法！」","questions":[{"type":"reading","lv":"m","stem":"老師帶小美用放大鏡，看到葉面有什麼？","options":["細小的突起和一層薄蠟","許多細小的蟲","很深的洞","一層油漆"],"answer":0,"why":"短文說葉面布滿細小的突起，上面還有一層薄薄的蠟。"},{"type":"reading","lv":"m","stem":"荷葉為什麼總是乾淨清爽？","options":["因為每天有人幫它擦拭","因為池塘裡的水很乾淨","因為水珠滑落時會把灰塵帶走","因為荷葉每天長出新葉子"],"answer":2,"why":"水縮成小水珠，順著葉面滑落，同時把灰塵一起帶走。"},{"type":"reading","lv":"m","stem":"文中「像一粒粒透明的珍珠」，是把什麼比成什麼？","options":["把荷葉比成珍珠","把池塘比成珍珠","把灰塵比成珍珠","把水珠比成珍珠"],"answer":3,"why":"前面說「圓滾滾的水珠」，用「像」把水珠比成透明的珍珠，是譬喻。"}]},{"id":"g3ha","title":"水躲到哪裡去了","text":"星期六下午，小美在陽台上晾了一件溼透的白襯衫。她對弟弟說：「太陽出來了，衣服很快就會乾。」弟弟覺得奇怪，問：「水跑到哪裡去了？」小美想了想，拿來一個玻璃杯，倒進半杯水，在杯子外面做了記號，再放到窗邊。第二天，杯裡的水竟然少了一小截。小美笑著說：「水被太陽曬熱以後，會慢慢變成看不見的水氣，飄到空氣裡。衣服上的水也是這樣不見的。」弟弟點點頭說：「原來水不是消失了，而是躲到空氣裡去了。」從那天起，只要天氣好，弟弟就搶著幫忙晾衣服，因為他想再看看水躲貓貓的魔術。","questions":[{"type":"reading","lv":"h","stem":"小美怎麼知道杯子裡的水變少了？","options":["因為弟弟把水喝掉了","因為杯子破了一個洞","因為她在杯子外面做了記號","因為媽媽換了新的水"],"answer":2,"why":"短文說她在杯子外面做了記號，隔天水位低於記號。"},{"type":"reading","lv":"h","stem":"衣服被太陽曬了會乾，最主要的原因是什麼？","options":["水被風吹進弟弟的杯子裡","水受熱後變成水氣，飄進空氣中","衣服把水吸進布裡面不見了","太陽把水變成了冰"],"answer":1,"why":"小美說水被曬熱後會變成看不見的水氣，飄到空氣裡。"},{"type":"reading","lv":"h","stem":"小美和弟弟的小實驗，最適合用下列哪一個標題？","options":["弟弟學晾衣服","玻璃杯的用途","小美的星期六","水躲到哪裡去了"],"answer":3,"why":"全文圍繞水去了哪裡，用實驗說明水變成水氣。"}]},{"id":"g3hb","title":"公車上的座位","text":"放學後，煜煜搭公車回家。車上人很多，他好不容易擠到一個座位，剛坐下就覺得很累，想閉上眼睛休息。這時，一位抱著小嬰兒的阿姨上了車，她的手提袋很重，臉上滿是汗水。煜煜偷偷看了她一眼，心裡想：「我也很累啊……」可是他想起老師說過：「禮貌不是做給別人看的，而是看見別人需要幫忙，就主動伸出手。」於是他紅著臉站起來說：「阿姨，請坐這裡。」阿姨連聲道謝，旁邊的爺爺也對他豎起大拇指。煜煜雖然站了一路，腿有點痠，心裡卻覺得比剛才更輕鬆，因為他做了一件讓自己驕傲的事。","questions":[{"type":"reading","lv":"h","stem":"阿姨上車時，下列哪一項描述符合短文？","options":["牽著一隻小狗","手上拿著雨傘","背著很大的書包","抱著小嬰兒，提著很重的袋子"],"answer":3,"why":"短文說阿姨抱著小嬰兒，手提袋很重。"},{"type":"reading","lv":"h","stem":"煜煜原本想休息，後來卻站起來讓座，最主要是因為什麼？","options":["司機要求他讓座","阿姨一直瞪著他","他想起老師的話，覺得該主動幫忙","他已經快到站了"],"answer":2,"why":"他雖然累，但想起老師說看見別人需要幫忙就要主動伸手，所以讓座。"},{"type":"reading","lv":"h","stem":"「禮貌不是做給別人看的，而是看見別人需要幫忙，就主動伸出手。」這句話想說明什麼？","options":["禮貌就是要大聲說話","真正的禮貌是出於真心，主動幫助別人","幫忙一定要讓大家看見","只有老人才需要幫助"],"answer":1,"why":"這句話強調禮貌是真心主動的行動，而不是為了表現給別人看。"}]},{"id":"s3e1","title":"曬棉被","text":"小明放學回家，看見媽媽正在陽台上曬棉被。媽媽說，棉被曬過太陽以後會變得蓬鬆又暖和，還能把細小的蟲子趕走。晚上，小明蓋著軟軟的棉被，睡得又香又甜。","questions":[{"type":"reading","lv":"e","stem":"小明放學回家，看見媽媽在哪裡曬棉被？","options":["院子","陽台","屋頂"],"answer":1,"why":"文中寫「媽媽正在陽台上曬棉被」。"},{"type":"reading","lv":"e","stem":"媽媽說，棉被曬過太陽以後會變得怎麼樣？","options":["又薄又輕","變得很潮溼","蓬鬆又暖和","顏色變深"],"answer":2,"why":"文中寫「會變得蓬鬆又暖和」。"},{"type":"reading","lv":"e","stem":"曬太陽除了讓棉被變暖和，還有什麼作用？","options":["把細小的蟲子趕走","把棉被洗乾淨","讓棉被變得更重","讓棉被有香味"],"answer":0,"why":"文中寫「還能把細小的蟲子趕走」。"}],"nz":true},{"id":"s3e2","title":"小烏龜","text":"煜煜養了一隻小烏龜。烏龜喜歡躲在殼裡，天氣冷的時候，牠幾乎不吃東西，也不太動。煜煜每天都幫牠換乾淨的水，還會放一小塊石頭，讓牠爬上去曬太陽。","questions":[{"type":"reading","lv":"e","stem":"煜煜養的是什麼動物？","options":["小烏龜","小兔子","小金魚"],"answer":0,"why":"文中第一句寫「煜煜養了一隻小烏龜」。"},{"type":"reading","lv":"e","stem":"天氣冷的時候，烏龜會怎麼樣？","options":["到處爬來爬去","吃得比平常多","幾乎不吃東西，也不太動","一直待在石頭上"],"answer":2,"why":"文中寫「天氣冷的時候，牠幾乎不吃東西，也不太動」。"},{"type":"reading","lv":"e","stem":"煜煜為什麼放一小塊石頭在水裡？","options":["讓水變得更乾淨","讓牠爬上去曬太陽","讓牠有東西可以吃"],"answer":1,"why":"文中寫「放一小塊石頭，讓牠爬上去曬太陽」。"}],"nz":true},{"id":"s3m1","title":"整齊的書桌","text":"下課鐘一響，小美先把桌上的書本收好，才走出教室。她說，東西亂放會讓人找不到，整齊一點，下次用的時候就能馬上拿到。所以小美的書桌總是乾乾淨淨的。","questions":[{"type":"reading","lv":"m","stem":"下課鐘響以後，小美做事的先後順序是什麼？","options":["先走出教室，再收書本","先收好書本，再走出教室","先擦桌子，再收書本"],"answer":1,"why":"文中寫「先把桌上的書本收好，才走出教室」。"},{"type":"reading","lv":"m","stem":"小美認為東西亂放會有什麼結果？","options":["書本會變舊","會讓人找不到","桌子會變小","同學會生氣"],"answer":1,"why":"文中寫「東西亂放會讓人找不到」。"},{"type":"reading","lv":"m","stem":"小美的書桌為什麼總是乾乾淨淨的？","options":["因為她很少使用書桌","因為老師每天幫她打掃","因為她習慣把東西收拾整齊"],"answer":2,"why":"「所以」之前說明她把東西整齊收好，因此書桌乾淨。"}],"nz":true},{"id":"s3m2","title":"白天長短","text":"夏天的白天比冬天長。夏天傍晚六、七點，天色還亮著；冬天太陽很早下山，五點多天就暗了。所以夏天放學後可以玩得比較久，冬天就要早點回家。","questions":[{"type":"reading","lv":"m","stem":"哪一個季節的傍晚，天色暗得比較早？","options":["夏天","冬天","兩個季節一樣"],"answer":1,"why":"文中說冬天五點多天就暗了，比夏天早。"},{"type":"reading","lv":"m","stem":"夏天放學後可以玩得比較久，是因為什麼？","options":["夏天的功課比較少","夏天的白天比較長，天黑得晚","夏天比較早放學","夏天的天氣比較涼快"],"answer":1,"why":"文中說夏天白天長，傍晚六、七點天還亮著，所以可以玩得久。"},{"type":"reading","lv":"m","stem":"根據短文，下列哪一句話說得正確？","options":["夏天五點多天就暗了","冬天的白天比夏天長","冬天放學後要早點回家","夏天太陽很早下山"],"answer":2,"why":"文中寫冬天「就要早點回家」；其他選項與文意相反。"}],"nz":true},{"id":"s3h1","title":"弟弟的石頭","text":"弟弟把撿到的石頭一顆顆洗乾淨，放進鞋盒裡，還在盒子上寫了「我的寶藏」。每次有人想打開來看，他就趕緊把盒子抱在懷裡。","questions":[{"type":"reading","lv":"h","stem":"從弟弟把石頭洗乾淨、還寫上「我的寶藏」，可以看出什麼？","options":["他很討厭這些石頭","他想把石頭送給別人","他非常珍惜這些石頭"],"answer":2,"why":"洗乾淨又稱作寶藏，可推知他把石頭看得很重要。"},{"type":"reading","lv":"h","stem":"有人想打開盒子時，弟弟趕緊抱住盒子，最可能是為什麼？","options":["怕別人把他的石頭弄壞或拿走","怕盒子太重別人拿不動","想請大家一起來玩","想趕快把盒子丟掉"],"answer":0,"why":"他把盒子當寶藏，抱緊盒子是在保護它。"},{"type":"reading","lv":"h","stem":"這段短文最適合的標題是哪一個？","options":["洗石頭的方法","鞋盒的用途","弟弟的石頭寶藏"],"answer":2,"why":"全文都在寫弟弟珍愛他的石頭。"}],"nz":true},{"id":"s3h2","title":"回家的路","text":"月亮像一盞掛在天上的小燈，默默陪著晚歸的人。小美走在回家的路上，雖然四周很暗，卻一點也不害怕，因為那盞小燈一直跟著她。","questions":[{"type":"reading","lv":"h","stem":"「月亮像一盞掛在天上的小燈」用了哪一種修辭？","options":["擬人","誇飾","譬喻","設問"],"answer":2,"why":"句中用「像」把月亮比成小燈，是譬喻。"},{"type":"reading","lv":"h","stem":"「默默陪著晚歸的人」把月亮當成人來寫，這是哪一種修辭？","options":["排比","擬人","設問"],"answer":1,"why":"月亮不會陪伴人，把它寫得像人一樣會陪伴，是擬人。"},{"type":"reading","lv":"h","stem":"小美四周很暗卻不害怕，最可能是因為什麼？","options":["她知道路上沒有人","月亮的光陪著她，讓她覺得安心","她已經走到家門口了","她帶了一盞真的小燈"],"answer":1,"why":"文中說那盞小燈（月亮）一直跟著她，所以不害怕。"}],"nz":true}]}};

  ['hist','wrong'].forEach(k=>{if(!Array.isArray(d.exam[k]))d.exam[k]=[]});
  ['best','stat'].forEach(k=>{const v=d.exam[k];if(!v||typeof v!=='object'||Array.isArray(v))d.exam[k]={}});
  if(!d.exam.mid||typeof d.exam.mid!=='object'||Array.isArray(d.exam.mid))d.exam.mid={};
  Object.keys(d.exam.mid).forEach(k=>{const v=d.exam.mid[k];
    if(!/^\d-\d$/.test(k)||!v||typeof v.best!=='number'||typeof v.n!=='number')delete d.exam.mid[k]}); // 段考紀錄:壞掉的就丟掉
  const keyExists=k=>{ // 只看題庫索引(這裡還不能呼叫出題函式,它們要等程式後面才定義)
    if(typeof k!=='string'||!/^[123]:(i\d+|p\d+q\d+)$/.test(k))return false;
    const [g,r]=k.split(':'),E=EXAM[+g];
    if(r[0]==='i')return !!E.items[+r.slice(1)];
    const m=r.match(/p(\d+)q(\d+)/);return !!(E.passages[+m[1]]&&E.passages[+m[1]].questions[+m[2]]);
  };
  d.exam.wrong=d.exam.wrong.filter(keyExists);

function hear(onInterim,cb){

  stopHear();speakSeq++;talking(false);try{speechSynthesis.cancel()}catch(e){} // 先停下正在唸的,不然會聽到自己的聲音
  const r=rec=new SR();r.lang='zh-TW';r.maxAlternatives=5;r.interimResults=true;
  let done=false,last='';const fin=(a,err)=>{if(done)return;done=true;cb(a,err)};
  r.onresult=e=>{

    if(!res.isFinal){last=res[0].transcript;return onInterim(last)}

// 聽到的話是第幾個選項?回傳 0~3,聽不懂回傳 -1
function matchOpt(texts,q){
  const hs=texts.map(t=>String(t).replace(/[\s,，。.?？!！、]/g,''));
  const ps=q.opts.map(o=>String(o.say).replace(/[\s,，。.?？!！、]/g,''));
  const hasCjk=p=>/[一-鿿]/.test(p);
  // 1. 選項全文(兩個字以上):「第二天」不會被當成「第二個」
  for(const h of hs){let best=-1;ps.forEach((p,i)=>{if(p.length>=2&&hasCjk(p)&&h.includes(p)&&(best<0||p.length>ps[best].length))best=i});if(best>=0)return best}
  // 2. 「第一個」「選二」「三號」
  for(const h of hs){const m=h.match(/第([一二兩三四壹1-4])(個|號|項)?|選([一二兩三四壹1-4])|([一二兩三四壹1-4])號/);if(m){const k=ORD[m[1]||m[3]||m[4]];if(k!=null&&k<q.opts.length)return k}}
  // 3. 水果名(選項文字裡沒有這個水果時才算)
  if(q.lab)for(const h of hs){const k=FRN.findIndex((n,i)=>i<q.opts.length&&h.includes(n)&&!ps.some(p=>p.includes(n)));if(k>=0)return k}
  // 4. 單字選項
  for(const h of hs){let best=-1;ps.forEach((p,i)=>{if(hasCjk(p)&&h.includes(p)&&(best<0||p.length>ps[best].length))best=i});if(best>=0)return best}
  // 5. 只說了「一、二、三」
  for(const h of hs){if(ORD[h]!=null&&ORD[h]<q.opts.length)return ORD[h]}
  return -1;
}

/* ===== 故事測驗 ===== */
let Q=null;
function mkQ(it,pool,n){
  const type=pick(['story','mean','def','blank','char']);
  const others=shuffle(pool.filter(x=>x!==it)).slice(0,n-1);
  const idiomOpts=()=>shuffle([it,...others]).map(x=>({h:zy(x.t,x.z),say:x.t,ok:x===it,cls:''}));
  if(type==='story')return{type,it,stem:STEM.story,body:it.s,bh:rt(it,'s'),opts:idiomOpts()};
  if(type==='mean')return{type,it,stem:STEM.mean,body:it.m,bh:rt(it,'m'),opts:idiomOpts()};
  if(type==='blank')return{type,it,stem:STEM.blank,body:it.u,bh:rt(it,'u'),opts:idiomOpts()};
  if(type==='def'){
    return{type,it,stem:{h:'「'+zy(it.t,it.z)+'」'+STEM.defTail.h,s:'「'+it.t+'」'+STEM.defTail.s},body:'',
      opts:shuffle([it,...others]).map(x=>({h:rt(x,'m'),say:x.m,ok:x===it,cls:'txt'+(x.g<=2?' zb':'')}))};
  }
  // char:缺一個字
  const pos=R(0,3),syl=it.z.split(' '),ch=it.t[pos];
  const chars=[...it.t].map((c,i)=>`<span class="big-c">${i===pos?'<span class="blank">？</span>':zy(c,syl[i])}</span>`).join('');
  const seen=new Set([ch]),dist=[];
  for(const x of shuffle(pool.filter(y=>y!==it))){
    const j=R(0,3),c=x.t[j];
    if(!seen.has(c)&&!it.t.includes(c)){seen.add(c);dist.push({c,z:x.z.split(' ')[j]})}
    if(dist.length>=n-1)break;
  }
  const opts=shuffle([{c:ch,z:syl[pos],ok:true},...dist.map(d=>({...d,ok:false}))]).map(o=>({h:zy(o.c,o.z),say:o.c,ok:o.ok,cls:'chr'}));
  return{type,it,stem:STEM.char,body:'',big:chars,opts,chars:true};
}
const weakIds=()=>IDIOMS.filter(x=>{const s=S.stat[x.id];return s&&s.w>0&&s.c<s.w+2}).map(x=>x.id);
function startQuiz(mode){
  mode=typeof mode==='string'?mode:'normal';
  const n=S.grade===1?3:4;
  let its;
  if(mode==='retry'){
    its=shuffle(weakIds().map(id=>IDIOMS[id])).slice(0,8);
    if(!its.length)return toast('目前沒有需要再練的成語，太棒了！');
  }else if(mode==='boss'){
    if(S.boss===today())return toast('今天的大魔王已經打敗了，明天再來！');
    its=shuffle(poolOf(S.grade)).slice(0,6);
  }else{
    // 還沒學會的成語優先出題
    its=shuffle(shuffle(poolOf(S.grade)).sort((a,b)=>mastered(a.id)-mastered(b.id)).slice(0,8));
  }
  const nn=mode==='boss'?4:n;
  Q={mode,qs:its.map(it=>mkQ(it,poolOf(it.g),nn)),i:0,ok:0,coins:0,water:0,done:false,sel:-1,wrong:[],combo:0,gain:0};
  renderQ();
}
function renderQ(){
  const q=Q.qs[Q.i],pct=Math.round(Q.i/Q.qs.length*100);
  const sayAll=q.stem.s+(q.body?String(q.body).split(q.it.t).join('這個成語'):''); // 導讀時成語名稱就是答案,唸成「這個成語」

  <div class="card">
    <div class="row"><div class="stem sp">${q.stem.h}</div>${spkBtn(sayAll)}</div>

    let c='opt '+o.cls;
    if(Q.done){if(o.ok)c+=' right';else if(i===Q.sel)c+=' wrong';else c+=' dim'}

  <div id="exp"></div>`);
  if(Q.done)showExplain(q);

}
function showExplain(q){

  </div>`;

}
function pickOpt(i){
  if(Q.done)return;
  const q=Q.qs[Q.i],o=q.opts[i];
  Q.done=true;Q.sel=i;
  const st=S.stat[q.it.id]||(S.stat[q.it.id]={c:0,w:0});
  if(o.ok){
    Q.ok++;Q.combo++;Q.gain=2+(Q.combo>=3?1:0); // 連對 3 題以上，每題多 1 枚金幣

    else{bonus=Q.ok;title='大魔王還很強，明天再挑戰！';emoji='👹'}

function renderSort(){

    <div class="slots">${[0,1,2,3].map(n=>{const idx=P.got[n];return `<div class="slot ${idx!=null?'on':''}">${idx!=null?zy(it.t[idx],P.syl[idx]):''}</div>`}).join('')}</div>
  </div>
  ${P.done?`<div class="card center" style="text-align:center"><div class="fb">🎉 ${zt('答對了！',it.g)} 💧+1 🪙+3</div><div class="moral ${it.g<=2?'zb':''}">${rt(it,'s')}</div><div style="margin-top:12px"><button class="btn" data-a="snext">${P.i+1>=P.items.length?zt('看成績',it.g)+' 🎁':zt('下一題',it.g)+' ▶'}</button></div></div>`:
  `<div class="tiles">${P.tiles.map(idx=>`<button class="tl" data-a="tile" data-i="${idx}" ${P.got.includes(idx)?'disabled':''}>${zy(it.t[idx],P.syl[idx])}</button>`).join('')}</div>
  <div class="row center" style="margin-top:14px"><button class="btn ghost small" data-a="sclear">↺ 重排</button></div>`}`);
}
function sortTile(idx){
  if(P.done||P.got.includes(idx))return;
  P.got.push(idx);const it=P.items[P.i];
  if(P.got.length<4)return renderSort();
  if(P.got.map(i=>it.t[i]).join('')===it.t){
    P.done=true;P.ok++;S.coins+=3;S.water+=1;S.corr++;
    const st=S.stat[it.id]||(S.stat[it.id]={c:0,w:0});st.c++;save();
    sfx('ok');burst(14);speak(it.t);renderSort();
  }else{
    P.miss++;sfx('bad');renderSort();
    document.querySelector('.slots').style.animation='shake .45s';
    setTimeout(()=>{P.got=[];renderSort()},650);
  }
}
function sortNext(){
  P.i++;P.got=[];P.done=false;P.tiles=[];
  if(P.i>=P.items.length){
    S.gplays=(S.gplays||0)+1;bump('game');save();

let F=null;
function startFlip(){
  const its=shuffle(poolOf(S.grade)).slice(0,6);
  const cards=shuffle(its.flatMap(x=>[{p:x.id,side:'a'},{p:x.id,side:'b'}]));
  F={cards,up:[],matched:new Set(),miss:0,lock:false};
  renderFlip();
}
function cardHTML(c,i){
  const x=IDIOMS[c.p],open=F.up.includes(i)||F.matched.has(c.p);
  if(!open)return `<button class="cd" data-a="card" data-i="${i}">🌾</button>`;
  const face=c.side==='a'?zy(x.t,x.z):`<span class="ue">${x.e}</span>${rt(x,'k')}`;
  return `<button class="cd up ${c.side==='b'?'b':''} ${F.matched.has(c.p)?'done':''}" data-a="card" data-i="${i}">${face}</button>`;
}
function renderFlip(){
  show('flip',`${topBar('🃏')}
  <div class="tip" style="margin-bottom:10px">${zy('找出成語和它的圖案','ㄓㄠˇ ㄔㄨ ㄔㄥˊ ㄩˇ ㄏㄢˋ ㄊㄚ ˙ㄉㄜ ㄊㄨˊ ㄢˋ')} (錯 ${F.miss} 次)</div>
  <div class="cards" id="cds">${F.cards.map(cardHTML).join('')}</div>`);
}
function flipCard(i){
  if(F.lock||F.up.includes(i)||F.matched.has(F.cards[i].p))return;
  F.up.push(i);
  if(F.up.length<2){$('#cds').innerHTML=F.cards.map(cardHTML).join('');return}
  const [a,b]=F.up.map(k=>F.cards[k]);
  $('#cds').innerHTML=F.cards.map(cardHTML).join('');
  if(a.p===b.p&&a.side!==b.side){
    F.matched.add(a.p);F.up=[];sfx('ok');speak(IDIOMS[a.p].t);
    $('#cds').innerHTML=F.cards.map(cardHTML).join('');
    if(F.matched.size===6)setTimeout(finishFlip,700);
  }else{
    F.miss++;F.lock=true;sfx('bad');
    setTimeout(()=>{F.up=[];F.lock=false;if(scr==='flip'){$('#cds').innerHTML=F.cards.map(cardHTML).join('')}},900);
  }
}
function finishFlip(){
  S.gplays=(S.gplays||0)+1;bump('game');
  const coins=Math.max(4,16-F.miss*2),water=2;
  S.coins+=coins;S.water+=water;save();sfx('win');burst(24);
  showResult({emoji:F.miss<=2?'🏆':'🌟',title:'全部配對成功！',lines:[`翻錯 ${F.miss} 次`,`💧 +${water}　🪙 +${coins}`],again:'flip'});
}

  {id:'pudding',e:'🍮',n:'布丁',need:{milk:1,egg:1},mins:3,sell:60,lv:7},
  {id:'pie',e:'🥧',n:'南瓜派',need:{pump:1,egg:2},mins:5,sell:150,lv:6}
];
RECIPES.forEach(r=>{ITEMS[r.id]={e:r.e,n:r.n,sell:r.sell}});
const VILL=[['🐻','小熊'],['🐰','小兔'],['🦊','小狐'],['🐼','貓熊'],['🐧','企鵝'],['🐿️','松鼠']];
const QT=[
  {k:'exam',t:'答對 # 題國語題',n:[6,10,15]},{k:'water',t:'幫作物澆水 # 次',n:[3,5,8]},
  {k:'harvest',t:'收成 # 次',n:[1,2,3]},{k:'game',t:'玩 # 次小遊戲',n:[1,2]},
  {k:'pet',t:'照顧動物 # 次(餵食或摸摸)',n:[2,3,4]},{k:'order',t:'完成 # 張村民訂單',n:[1,2]},
  {k:'craft',t:'在加工坊做 # 樣東西',n:[1,2]},{k:'mock',t:'完成 # 次模擬考',n:[1]}
];
const FARM_ACTS=new Set(['plant','seed','water','waterall','harvest','buyplot','buydec','buyani','pet','petfeed','petpat','petcollect','petname','pnameok',
  'barn','sell','sellall','work','craft','workget','deliver','orderskip','claimq']);

const fmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000));return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
function lvOf(xp){return 1+Math.floor(Math.sqrt((xp||0)/8))}
const xpFor=l=>(l-1)*(l-1)*8;
const curLv=()=>lvOf(S.fxp);
function unlockNote(l){
  const u=[];
  Object.values(CROPS).forEach(c=>{if(c.lv===l)u.push(c.e+c.n)});
  Object.values(ANIMALS).forEach(a=>{if(a.lv===l)u.push(a.e+a.n)});
  RECIPES.forEach(r=>{if(r.lv===l)u.push(r.e+r.n)});
  if(l===5)u.push('第 3 個加工位');
  return u.length?'解鎖 '+u.join('、'):'';
}
function gainXp(n){
  const a=curLv();S.fxp+=n;const b=curLv();
  if(b>a){sfx('win');burst(20);setTimeout(()=>toast(`🎉 農場升到 Lv.${b}!${unlockNote(b)}`),300)}
}
const seasonOf=()=>{const m=new Date().getMonth()+1;return m>=3&&m<=5?'春':m>=6&&m<=8?'夏':m>=9&&m<=11?'秋':'冬'};
const SEA_E={'春':'🌸','夏':'☀️','秋':'🍂','冬':'❄️'};
function weatherOf(){const d=today();let h=0;for(const c of d)h=(h*31+c.charCodeAt(0))%97;return ['☀️','☀️','⛅','🌧️','🌈'][h%5]}
const WNAME={'☀️':'晴天','⛅':'多雲','🌧️':'下雨天','🌈':'彩虹天'};
function rainCheck(){ // 下雨天：每天第一次進農場，作物自動喝一口水
  if(weatherOf()==='🌧️'&&S.rain!==today()){
    S.rain=today();let n=0;
    S.plots.forEach(p=>{if(p&&p.w<CROPS[p.c].need){p.w++;n++}});save();
    if(n)setTimeout(()=>toast(`🌧️ 下雨了！${n} 株作物自動喝到水`),400);
  }
}
const inSeason=k=>!!(CROPS[k]&&CROPS[k].ss.includes(seasonOf()));
const price=k=>Math.round(ITEMS[k].sell*(inSeason(k)?1.2:1));
const have=k=>S.inv[k]||0;
const addInv=(k,n)=>{S.inv[k]=have(k)+n};
const invCount=()=>Object.values(S.inv).reduce((a,b)=>a+b,0);

/* ----- 每日任務 ----- */
function ensureQuests(){
  if(!S.quests||S.quests.d!==today()){
    S.quests={d:today(),all:false,q:shuffle(QT).slice(0,3).map(t=>{const n=pick(t.n);return{k:t.k,t:t.t.replace('#',n),n,have:0,got:0}})};
    save();
  }
}
function bump(k,n=1){ // 做了某件事，任務進度加一(其他畫面也會呼叫)
  ensureQuests();let ch=false;
  S.quests.q.forEach(q=>{if(q.k===k&&q.have<q.n){q.have=Math.min(q.n,q.have+n);ch=true}});
  if(ch)save();
}
function claimQuest(i){
  const q=S.quests.q[i];if(!q||q.got||q.have<q.n)return;
  q.got=1;S.coins+=10;S.water+=2;gainXp(5);sfx('win');burst(10);
  if(S.quests.q.every(x=>x.got)&&!S.quests.all){S.quests.all=true;S.coins+=20;toast('🎁 今日任務全部完成！額外 🪙20');}
  save();renderFarm();
}

/* ----- 村民訂單 ----- */
function newOrder(){
  const lv=curLv(),pool=[];
  Object.entries(CROPS).forEach(([k,c])=>{if(c.lv<=lv)pool.push(k)});
  Object.values(ANIMALS).forEach(a=>{if(a.lv<=lv)pool.push(a.pid)});
  RECIPES.forEach(r=>{if(r.lv<=lv)pool.push(r.id)});
  const kinds=lv>=3&&Math.random()<.5?2:1,ids=shuffle(pool).slice(0,kinds),need={};let sum=0;
  ids.forEach(id=>{const n=RECIPES.some(r=>r.id===id)?1:R(1,3);need[id]=n;sum+=ITEMS[id].sell*n});
  return{v:pick(VILL),need,coins:Math.round(sum*1.6)+4,xp:5+kinds*3};
}
function fillOrders(){while(S.orders.length<3)S.orders.push(newOrder())}
function deliver(i){
  const o=S.orders[i];if(!o)return;
  if(!Object.entries(o.need).every(([k,n])=>have(k)>=n))return toast('材料還不夠喔');
  Object.entries(o.need).forEach(([k,n])=>{S.inv[k]-=n});
  S.coins+=o.coins;S.ordDone++;gainXp(o.xp);bump('order');
  S.orders.splice(i,1);fillOrders();save();sfx('win');burst(14);
  toast(`${o.v[0]} ${o.v[1]}說謝謝！🪙+${o.coins}`);renderFarm();
}

/* ----- 加工坊 ----- */
const workSlots=()=>curLv()>=5?3:2;
function workModal(){
  const lv=curLv(),now=Date.now();
  const list=S.work.map((w,i)=>{const r=RECIPES.find(x=>x.id===w.r),ready=now>=w.t;
    return `<button class="btn ${ready?'':'ghost'} small" data-a="workget" data-i="${i}" style="width:100%;margin-bottom:6px">${r.e} ${r.n} ${ready?'→ 領取！':`<span data-wt="${w.t}">⏳ ${fmt(w.t-now)}</span>`}</button>`}).join('');
  const recs=RECIPES.map(r=>{
    const locked=r.lv>lv,ok=Object.entries(r.need).every(([k,n])=>have(k)>=n);
    const need=Object.entries(r.need).map(([k,n])=>`${ITEMS[k].e}${have(k)}/${n}`).join(' ');
    return `<button data-a="craft" data-k="${r.id}" ${locked||!ok||S.work.length>=workSlots()?'disabled':''}><span class="ue">${r.e}</span>${r.n}<br><small>${locked?'Lv.'+r.lv+' 解鎖':need}</small><br><small>${r.mins} 分鐘 → 🪙${r.sell}</small></button>`}).join('');
  openModal(`<h2>🏭 加工坊</h2><div class="tip" style="margin-bottom:8px">把作物和動物產品加工，賣的錢更多！(加工位 ${S.work.length}/${workSlots()})</div>
    ${list||'<div class="tip" style="margin-bottom:8px">目前沒有在加工的東西</div>'}
    <div class="shop">${recs}</div>
    <div class="row center" style="margin-top:12px"><button class="btn ghost small" data-a="close">關閉</button></div>`);
}
function startCraft(id){
  const r=RECIPES.find(x=>x.id===id);if(!r)return;
  if(S.work.length>=workSlots())return toast('加工位滿了');
  if(!Object.entries(r.need).every(([k,n])=>have(k)>=n))return toast('材料不夠');
  Object.entries(r.need).forEach(([k,n])=>{S.inv[k]-=n});
  S.work.push({r:id,t:Date.now()+r.mins*60000});save();sfx('coin');renderFarm();workModal();
}
function getCraft(i){
  const w=S.work[i];if(!w||Date.now()<w.t)return;
  addInv(w.r,1);S.work.splice(i,1);S.craftDone++;bump('craft');gainXp(4);save();sfx('win');burst(10);
  toast(`${ITEMS[w.r].e} ${ITEMS[w.r].n} 做好了！放進倉庫`);renderFarm();workModal();
}

/* ----- 倉庫 ----- */
function barnModal(){
  const ids=Object.keys(S.inv).filter(k=>S.inv[k]>0&&ITEMS[k]);
  openModal(`<h2>📦 倉庫</h2><div class="tip" style="margin-bottom:6px">${SEA_E[seasonOf()]} 現在是${seasonOf()}天，當季作物賣價 +20%</div>
    ${ids.length?`<div class="shop">${ids.map(k=>{const it=ITEMS[k];
      return `<div style="background:#fff;border-radius:18px;padding:8px;box-shadow:0 4px 0 #cfe6c0;font-size:18px;text-align:center"><span style="font-size:36px">${it.e}</span><br>${it.n} ×${S.inv[k]}<br><small>單價 🪙${price(k)}${inSeason(k)?' 當季':''}</small>
      <div class="row center" style="margin-top:4px"><button class="btn small" data-a="sell" data-k="${k}">賣 1 個</button><button class="btn small ghost" data-a="sellall" data-k="${k}">全賣</button></div></div>`}).join('')}</div>`:'<div class="tip">倉庫空空的，去收成作物或照顧動物吧！</div>'}
    <div class="row center" style="margin-top:12px"><button class="btn ghost small" data-a="close">關閉</button></div>`);
}
function sellItem(k,all){
  const n=all?have(k):Math.min(1,have(k));if(n<=0)return;
  const gain=price(k)*n;S.inv[k]-=n;S.coins+=gain;save();sfx('coin');floatText('🪙+'+gain);renderFarm();barnModal();
}

/* ----- 寵物(動物)互動 ----- */
const moodNow=a=>Math.max(0,Math.min(100,a.mood-Math.floor((Date.now()-a.mt)/90000)));
function petModal(i){
  const a=S.animals[i];if(!a)return;
  const d=ANIMALS[a.t],m=moodNow(a),ready=Date.now()>=a.r;
  openModal(`<div style="text-align:center"><div class="mascot" style="font-size:80px">${d.e}</div>
    <h2>${a.name?esc(a.name):d.n} <button class="btn ghost small" data-a="petname" data-i="${i}">✏️ 改名</button></h2>
    <div class="bar"><i style="width:${m}%"></i></div>
    <div class="tip">心情 ${m} / 100 ${m>=70?'😊 很開心(產出快 30%，還可能加倍)':m>=40?'😐 普通':'😢 需要照顧'}</div>
    <div class="row center" style="margin:10px 0"><button class="btn small mint" data-a="petfeed" data-i="${i}">🌾 餵食 🪙2</button><button class="btn small purple" data-a="petpat" data-i="${i}">🤚 摸摸</button></div>
    <button class="btn" data-a="petcollect" data-i="${i}" ${ready?'':'disabled'}>${ready?`收成 ${d.prod} ${d.pn}`:'⏳ 還在準備'}</button>
    <div class="row center" style="margin-top:12px"><button class="btn ghost small" data-a="close">關閉</button></div></div>`);
}
function petCare(i,kind){
  const a=S.animals[i];if(!a)return;
  const now=Date.now();
  if(kind==='feed'){
    if(S.coins<2)return toast('金幣不夠喔');
    S.coins-=2;a.mood=Math.min(100,moodNow(a)+30);
  }else{
    if(now-a.pat<45000)return toast('剛剛才摸過，讓牠休息一下');
    a.pat=now;a.mood=Math.min(100,moodNow(a)+12);
  }
  a.mt=now;bump('pet');gainXp(1);save();sfx('coin');floatText('💗');renderFarm();petModal(i);
}
function petCollect(i){
  const a=S.animals[i],d=a&&ANIMALS[a.t];if(!a||Date.now()<a.r)return;
  const m=moodNow(a);let n=1;if(m>=70&&Math.random()<.3)n=2;
  addInv(d.pid,n);a.r=Date.now()+Math.round(d.mins*60000*(m>=70?.7:1));gainXp(2);save();sfx('coin');
  toast(`${d.prod} ${d.pn} ×${n} 放進倉庫！${n>1?'(開心加倍！)':''}`);renderFarm();petModal(i);
}

/* ----- 農場畫面 ----- */
function renderFarm(){
  ensureQuests();fillOrders();rainCheck();
  const now=Date.now(),np=S.plots.length,lv=curLv(),xp0=xpFor(lv),xp1=xpFor(lv+1),sea=seasonOf(),wea=weatherOf();
  const plots=S.plots.map((p,i)=>{
    if(!p)return `<button class="plot empty" data-a="plant" data-i="${i}"><span class="pe">➕</span><small>種種子</small></button>`;
    const c=CROPS[p.c],ripe=p.w>=c.need;
    return `<button class="plot ${ripe?'ripe':''}" data-a="${ripe?'harvest':'water'}" data-i="${i}"><span class="pe">${ripe?c.e:p.w>0?'🌿':'🌱'}</span><small>${ripe?'收成！':'💧 '+p.w+' / '+c.need}</small></button>`;
  }).join('')+(np<MAX_PLOTS?`<button class="plot buy" data-a="buyplot"><span class="pe">🟫</span><small>新田地 🪙${PLOT_COST[np-4]}</small></button>`:'');
  const anis=S.animals.map((a,i)=>{
    const d=ANIMALS[a.t],ready=now>=a.r,m=moodNow(a);
    return `<button class="plot ${ready?'ripe':''}" data-a="pet" data-i="${i}" style="background:#e8c27a;box-shadow:0 5px 0 #c79b4c"><span class="pe">${d.e}</span><small data-ti="${i}">${ready?'收 '+d.prod+' '+d.pn:'⏳ '+fmt(a.r-now)}</small><small>${m>=70?'😊':m>=40?'😐':'😢'} ${a.name?esc(a.name):d.n}</small></button>`;
  }).join('');
  const orders=S.orders.map((o,i)=>{
    const ok=Object.entries(o.need).every(([k,n])=>have(k)>=n);
    const need=Object.entries(o.need).map(([k,n])=>`${ITEMS[k].e}${Math.min(have(k),n)}/${n}`).join(' ');
    return `<div class="ord"><span class="ue">${o.v[0]}</span><div class="sp"><b>${o.v[1]}想要</b><br>${need}<br><small>🪙${o.coins} ・ ⭐${o.xp}</small></div>
      <div><button class="btn small ${ok?'mint':'ghost'}" data-a="deliver" data-i="${i}" ${ok?'':'disabled'}>交貨</button><br><button class="btn small ghost" data-a="orderskip" data-i="${i}" style="margin-top:4px;min-height:36px;font-size:15px">換一張</button></div></div>`;
  }).join('');
  const quests=S.quests.q.map((q,i)=>`<div class="ord"><div class="sp">${q.t}<br><small>${q.have}/${q.n} ・ 🪙10 💧2</small></div>
    <button class="btn small ${q.got?'ghost':q.have>=q.n?'mint':'ghost'}" data-a="claimq" data-i="${i}" ${q.got||q.have<q.n?'disabled':''}>${q.got?'✅ 已領':q.have>=q.n?'領獎！':'進行中'}</button></div>`).join('');
  const readyWork=S.work.some(w=>now>=w.t);
  show('farm',`${topBar(zy('我的農場','ㄨㄛˇ ˙ㄉㄜ ㄋㄨㄥˊ ㄔㄤˇ'))}
  <div class="card" style="padding:10px 14px">
    <div class="row"><b>Lv.${lv}</b><span class="tip">${SEA_E[sea]} ${sea}天 ・ ${wea} ${WNAME[wea]}</span><span class="sp"></span><span class="tip">⭐ ${S.fxp - xp0} / ${xp1 - xp0}</span></div>
    <div class="bar" style="margin:4px 0 0"><i style="width:${Math.min(100,(S.fxp-xp0)/(xp1-xp0)*100)}%"></i></div>
  </div>
  <div class="row center" style="margin-bottom:10px"><button class="btn small mint" data-a="waterall">🚿 全部澆水</button><button class="btn small ghost" data-a="barn">📦 倉庫 ${invCount()}</button><button class="btn small purple" data-a="work">🏭 加工坊${readyWork?' 🔔':''}</button></div>
  <div class="scene">${S.decor.length?DECOR.filter(d=>S.decor.includes(d.id)).map((d,i)=>`<span style="animation-delay:${i*.3}s">${d.e}</span>`).join(''):'<span class="tip">買裝飾，把農場變漂亮！</span>'}</div>
  <div class="field">${plots}</div>
  <div class="tip" style="margin-top:8px;text-align:center">${S.harv?'收成紀錄：'+Object.entries(S.hc).map(([k,n])=>CROPS[k]?CROPS[k].e+n:'').join(' '):'點田地種種子，用 💧 澆水，長大了收成放進倉庫！'}</div>
  <h2>📋 村民訂單</h2>${orders}
  <h2>✅ 今日任務</h2>${quests}
  <h2>🐾 動物牧場</h2>
  <div class="field pen">${anis||'<div class="tip" style="grid-column:1/-1;text-align:center;padding:12px">還沒有動物，到下面買一隻吧！</div>'}</div>
  <h2>🛒 動物商店</h2>
  <div class="shop">${Object.entries(ANIMALS).map(([k,d])=>{const lock=d.lv>lv;
    return `<button data-a="buyani" data-k="${k}" ${lock||S.coins<d.cost||S.animals.length>=MAX_ANIMALS?'disabled':''}><span class="ue">${d.e}</span>${d.n} ${lock?'Lv.'+d.lv+' 解鎖':'🪙'+d.cost}<br><small>每 ${d.mins} 分鐘 ${d.prod}</small></button>`}).join('')}</div>
  <h2>🎀 農場裝飾</h2>
  <div class="shop">${DECOR.map(d=>{const own=S.decor.includes(d.id);
    return `<button data-a="buydec" data-k="${d.id}" ${own||S.coins<d.cost?'disabled':''}><span class="ue">${d.e}</span>${d.n} ${own?'✅':'🪙'+d.cost}${d.perk?`<br><small>${d.perk}</small>`:''}</button>`}).join('')}</div>
  <div class="row center" style="margin-top:16px"><button class="btn" data-a="exam">📝 去考試賺 💧</button></div>`);
}
function plantMenu(i){
  const lv=curLv();
  openModal(`<h2>🌱 選一個種子</h2><div class="tip" style="margin-bottom:6px">${SEA_E[seasonOf()]} ${seasonOf()}天當季作物賣價 +20%</div><div class="shop">${Object.entries(CROPS).map(([k,c])=>{const lock=c.lv>lv;
    return `<button data-a="seed" data-i="${i}" data-k="${k}" ${lock||S.coins<c.cost?'disabled':''}><span class="ue">${c.e}</span>${c.n} ${lock?'Lv.'+c.lv+' 解鎖':'🪙'+c.cost}<br><small>要 💧${c.need} → 🪙${c.sell}${inSeason(k)?' 🌟當季':''}</small></button>`}).join('')}</div>
  <div class="row center" style="margin-top:12px"><button class="btn ghost small" data-a="close">關閉</button></div>`);
}
function farmAct(a,d,el){
  const i=+d.i;
  if(a==='plant')return plantMenu(i);
  if(a==='seed'){
    const c=CROPS[d.k];if(!c||c.lv>curLv())return;if(S.coins<c.cost)return toast('金幣不夠喔');
    S.coins-=c.cost;S.plots[i]={c:d.k,w:0};save();closeModal();sfx('coin');return renderFarm();
  }
  if(a==='water'){
    const p=S.plots[i];if(!p)return;
    if(S.water<1){sfx('bad');return toast('沒有水滴了！先去考試或玩遊戲賺 💧 吧')}
    S.water--;p.w++;bump('water');save();sfx('coin');return renderFarm();
  }
  if(a==='waterall'){
    let n=0;S.plots.forEach(p=>{while(p&&p.w<CROPS[p.c].need&&S.water>0){p.w++;S.water--;n++}});
    if(!n){sfx('bad');return toast(S.water<1?'沒有水滴了！':'沒有需要澆水的作物')}
    bump('water',n);save();sfx('coin');toast(`🚿 澆了 ${n} 次水`);return renderFarm();
  }
  if(a==='harvest'){
    const p=S.plots[i],c=CROPS[p.c];addInv(p.c,1);S.plots[i]=null;S.harv++;S.hc[p.c]=(S.hc[p.c]||0)+1;
    bump('harvest');gainXp(3+c.need);save();sfx('win');burst(12);
    toast(`收成 ${c.e} ${c.n}，放進倉庫！`);return renderFarm();
  }
  if(a==='buyplot'){
    const cost=PLOT_COST[S.plots.length-4];
    if(S.coins<cost)return toast(`要 🪙${cost} 才能買新田地`);
    S.coins-=cost;S.plots.push(null);save();sfx('coin');return renderFarm();
  }
  if(a==='buydec'){
    const dc=DECOR.find(x=>x.id===d.k);
    if(!dc||S.decor.includes(dc.id))return;
    if(S.coins<dc.cost)return toast('金幣不夠喔');
    S.coins-=dc.cost;S.decor.push(dc.id);save();sfx('win');burst(16);toast(`農場多了 ${dc.e} ${dc.n}!`);return renderFarm();
  }
  if(a==='buyani'){
    const ani=ANIMALS[d.k];
    if(!ani||ani.lv>curLv())return;
    if(S.animals.length>=MAX_ANIMALS)return toast('牧場已經住滿了');
    if(S.coins<ani.cost)return toast('金幣不夠喔');
    S.coins-=ani.cost;S.animals.push({t:d.k,r:Date.now()+ani.mins*60000,mood:70,mt:Date.now(),name:'',pat:0});gainXp(3);save();sfx('coin');burst(10);return renderFarm();
  }
  if(a==='pet')return petModal(i);
  if(a==='petfeed')return petCare(i,'feed');
  if(a==='petpat')return petCare(i,'pat');
  if(a==='petcollect')return petCollect(i);
  if(a==='petname'){
    openModal(`<h2 style="text-align:center">✏️ 幫牠取一個名字</h2><div class="tip" style="text-align:center;font-size:20px">最多 4 個字</div><input id="pname" maxlength="4" autocomplete="off" value="${esc(S.animals[i].name||'')}" style="font-size:28px;width:100%;margin:10px 0;text-align:center"><div class="row center"><button class="btn mint" data-a="pnameok" data-i="${i}">好了</button><button class="btn ghost" data-a="close">取消</button></div>`);
    setTimeout(()=>{const e=$('#pname');if(e)e.focus()},60);return;
  }
  if(a==='pnameok'){
    const an=S.animals[i];if(!an)return closeModal();
    an.name=(($('#pname')||{}).value||'').trim().slice(0,4);save();renderFarm();return petModal(i);
  }
  if(a==='barn')return barnModal();
  if(a==='sell')return sellItem(d.k,false);
  if(a==='sellall')return sellItem(d.k,true);
  if(a==='work')return workModal();
  if(a==='craft')return startCraft(d.k);
  if(a==='workget')return getCraft(i);
  if(a==='deliver')return deliver(i);
  if(a==='orderskip'){S.orders[i]=newOrder();save();return renderFarm()}
  if(a==='claimq')return claimQuest(i);
}
// 倒數計時：動物產出、加工坊
let lastReady=[];
setInterval(()=>{
  if(scr!=='farm')return;
  const now=Date.now();let changed=false;
  S.animals.forEach((a,i)=>{
    const ready=now>=a.r;
    if(lastReady[i]!==undefined&&lastReady[i]!==ready)changed=true;
    lastReady[i]=ready;
    const el=document.querySelector(`[data-ti="${i}"]`);
    if(el&&!ready)el.textContent='⏳ '+fmt(a.r-now);
  });
  document.querySelectorAll('[data-wt]').forEach(el=>{const t=+el.dataset.wt;if(now>=t){changed=true}else el.textContent='⏳ '+fmt(t-now)});
  if(changed){renderFarm();if($('#mdl').classList.contains('on')&&document.querySelector('[data-wt]'))workModal()}
},1000);

const typeName=(t,g)=>{const i=TYPE_INFO[t];if(!i)return t;if(g===3&&t==='similar')return '字詞辨正';return g<=2?zy(i[0],i[1]):i[0]};

const SIGNS='，。！？、：；「」『』（）《》,.!?:;()\\s　';
const stripSigns=s=>String(s).replace(new RegExp('['+SIGNS+']','g'),'');

/* 把一段文字排成 HTML:一、二年級加注音；〔注音〕做成黃色標籤；＿＿ 做成空格 */
function exHtml(text,z){
  let h=z?zy(text,z):esc(text);
  h=h.replace(/〔([^〕]*)〕/g,'<span class="ztag">$1</span>').replace(/＿＿/g,'<span class="blank">　　</span>').replace(/\n/g,'<br>');
  return h;
}
const exPlain=t=>String(t).replace(/〔[^〕]*〕/g,'').replace(/＿＿/g,'，');
const exSay=t=>String(t).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu,'').replace(/〔[^〕]*〕|＿＿/g,'，'); // 圖案不唸出來(看圖題的圖案名字就是答案);唸題用:注音標籤和空格都只停頓一下,不唸出「空格」

/* 取題：key 例如 "2:i15"(一般題)、"2:p1q2"(短文第 2 篇第 3 題) */
function exFind(key){
  const [g,rest]=key.split(':'),E=EXAM[+g];if(!E)return null;
  if(rest[0]==='i'){const it=E.items[+rest.slice(1)];return it?exMake(+g,key,it,null):null}
  const m=rest.match(/p(\d+)q(\d+)/);if(!m)return null;
  const p=E.passages[+m[1]],it=p&&p.questions[+m[2]];
  return it?exMake(+g,key,it,p):null;
}
function exMake(g,key,it,p){
  const z=g<=2&&!(p&&p.nz),q={key,g,type:it.type,it,src:it.src||'',nz:!!(p&&p.nz),z}; // q.z:這題要不要加注音,各畫面都用它 // nz:這篇短文(和它的題目)不加注音,練習不看注音讀短文
  q.stem=exHtml(it.stem,z?it.zs:null);
  q.why=exHtml(it.why,z?it.zw:null);
  if(p){
    q.pass=(p.title?`<div style="text-align:center;font-size:26px;margin-bottom:4px">${exHtml(p.title,z?p.ztl:null)}</div>`:'')+`<div class="pre">${exHtml(p.text,z?p.zt:null)}</div>`;
    q.passSay=(p.title||'')+'。'+p.text;
  }
  if(it.type==='order'){
    const words=it.words.map((w,i)=>({w,h:exHtml(w,z&&it.zws?it.zws[i]:null),i}));
    q.words=shuffle(words);
    if(q.words.map(x=>x.i).join('')==='0123456789'.slice(0,words.length))q.words=shuffle(words);
    q.accept=(it.accept||[]).map(stripSigns);
  }else{
    q.opts=shuffle(it.options.map((o,i)=>({h:(z&&it.zo&&it.zo[i])?zy(o,it.zo[i]):esc(o),say:o,ok:i===it.answer,len:[...o].length})));
  }
  // 考注音、讀音的題型:唸出詞語或選項,聲音本身就是答案,所以不唸出被考的詞,也不唸選項
  const SOUND_STEM={pinyin:'請看畫面上的詞，選出它正確的注音。',poly:'請看畫面上的題目，再選出答案。'};
  const stemSay=SOUND_STEM[it.type]||exSay(it.stem)+(/〔[^〕]*〕/.test(it.stem)?'。請看畫面上黃色的注音':'');
  if(q.opts){
    const mx=Math.max(...q.opts.map(o=>o.len));q.lab=mx>1;
    const allRead=q.opts.every(o=>/[一-鿿]/.test(o.say));
    // 題目和選項分開唸:自動導讀只唸題目,選項要孩子按「聽選項」才唸,不會一開始就把答案夾在裡面唸出來
    q.osay=!allRead||['zy2char','pinyin','poly'].includes(it.type)?'':q.lab?q.opts.map(o=>o.say).join('。'):'選項有：'+q.opts.map(o=>o.say).join('、');
  }
  q.say=stemSay;
  return q;
}
function exAll(g){
  const E=EXAM[g],keys=[];
  E.items.forEach((it,i)=>keys.push(`${g}:i${i}`));
  E.passages.forEach((p,pi)=>p.questions.forEach((q,qi)=>keys.push(`${g}:p${pi}q${qi}`)));
  return keys;
}
function exTypeOf(key){const [g,r]=key.split(':'),E=EXAM[+g];
  if(r[0]==='i')return E.items[+r.slice(1)].type;return 'reading'}

function mockKeys(g){
  const E=EXAM[g],keys=[],lv=lvFor(g);
  const cand=psgOf(E,lv),{p,pi}=cand[R(0,cand.length-1)];
  p.questions.forEach((q,qi)=>keys.push(`${g}:p${pi}q${qi}`));
  const by={};
  E.items.forEach((it,i)=>{if(exOk(it,lv))(by[it.type]=by[it.type]||[]).push(`${g}:i${i}`)});
  Object.keys(by).forEach(t=>{by[t]=shuffle(by[t])});
  const order=shuffle(Object.keys(by));let guard=0,orders=0;
  while(keys.length<MOCK_N&&guard++<500){
    for(const t of order){
      if(keys.length>=MOCK_N)break;
      if(t==='order'&&orders>=2)continue;
      const k=by[t].pop();if(k){keys.push(k);if(t==='order')orders++}
    }
  }
  // 閱讀題放最後面，其他題打散
  const read=keys.slice(0,p.questions.length),rest=shuffle(keys.slice(p.questions.length));
  return [...rest,...read];
}

    else keys=shuffle(E.items.map((it,i)=>it.type===arg&&exOk(it,lv)?`${g}:i${i}`:null).filter(Boolean)).slice(0,10);
  }else{

  }
  if(!keys.length)return toast('目前沒有題目');
  X={mode,arg,g,lv:mode==='wrong'?null:lv,qs:keys.map(exFind).filter(Boolean),i:0,ok:0,coins:0,water:0,sel:-1,done:false,combo:0,gain:0,wrong:[],chain:[]};
  renderXQ();
}
