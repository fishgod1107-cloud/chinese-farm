/* ===== 語音問答:小老師唸題目和選項 → 自動開始聽 → 說答案 → 馬上回應 =====
   一局 8 題,用考試題庫裡「聽得懂的題型」;不能用麥克風的地方改用點選項 */
const VQ_TYPES=['antonym','synonym','wordmean','meaning','measure','dialog','cloze','pattern','rhetoric'];
function startVQ(){
  const g=S.grade,E=EXAM[g];
  const keys=shuffle(E.items.map((it,i)=>VQ_TYPES.includes(it.type)&&it.options&&it.options.every(o=>/[一-鿿]/.test(o))?g+':i'+i:null).filter(Boolean)).slice(0,8);
  if(keys.length<4)return toast('這個年級的語音題還不夠');
  X={mode:'voice',arg:'',g,qs:keys.map(exFind).filter(Boolean),i:0,ok:0,coins:0,water:0,sel:-1,done:false,combo:0,gain:0,wrong:[],chain:[],ask:0,tries:0};
  renderVQ();
}
const vqLive=id=>scr==='vq'&&X&&X.ask===id&&!X.done;
const vqBub=t=>{const b=$('#vbub');if(b)b.textContent=t};
function renderVQ(){
  const q=X.qs[X.i],z=q.z,pct=Math.round(X.i/X.qs.length*100);
  const mx=Math.max(...q.opts.map(o=>o.len)),cls=mx<=1?'chr':mx<=5?'mid':'txt'+(z?' zb':'');
  X.ask++;X.tries=0;X.done=false;X.sel=-1;
  show('vq',`${topBar('🎤 '+(X.i+1)+' / '+X.qs.length)}
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="mhead"><span class="mascot" style="font-size:56px">🐥</span><div class="bubble sp" id="vbub">聽題目喔…</div></div>
  <div class="card"><div class="row"><div class="stem ${z?'zb':''} sp">${q.stem}</div><button class="spk" data-a="vrep" aria-label="再聽一次">🔊</button></div></div>
  <div class="opts ${mx<=1?'chars':''}" id="vopts">${q.opts.map((o,i)=>`<button class="opt ${cls}" data-a="vpick" data-i="${i}">${mx<=1?'':`<span class="ob">${FRE[i]}</span>`}${o.h}</button>`).join('')}</div>
  <div class="tip center" id="vstat" style="min-height:26px;margin-top:8px"></div>
  <div class="row center">${q.osay?'<button class="btn ghost small" data-a="osay">👂 聽選項</button>':''}</div>
  <div id="vexp"></div>
  <div class="row center" style="margin-top:10px">${SR&&!micOff?'<button class="btn purple" id="mic" data-a="vtalk">🎤 說答案</button>':''}<button class="btn ghost small" id="vnx" data-a="vnext">下一題 ▶</button></div>`);
  vqSpeakQ(X.ask);
}
function vqSpeakQ(id){
  const q=X.qs[X.i];vqBub('聽題目喔…');vmsg('');
  vSay(q.say,()=>{if(vqLive(id))vqListen(id)});
}
function vqListen(id){
  if(!SR||micOff){vqBub('點選項回答喔！');return vmsg('用手點下面的選項')}
  vqBub('換你說囉！');vmsg('👂 '+micHint(X.qs[X.i]));micBtn(true);
  hear(t=>{if(vqLive(id))vmsg('👂 '+esc(t)+'…')},(alts,err)=>{
    if(!vqLive(id))return;micBtn(false);
    if(err==='denied'){vqBub('這裡不能用麥克風');return vmsg(hearErr(null,err))}
    const i=alts?matchOpt(alts,X.qs[X.i]):-1;
    if(i>=0)return vqAnswer(i);
    const q=X.qs[X.i];X.tries++;
    if(X.tries===1&&q.osay){ // 第一次沒聽懂:才把選項唸給她聽
      vqBub('我把選項唸給你聽！');return vSay('我沒聽清楚，我把選項唸給你聽。'+q.osay,()=>{if(vqLive(id))vqListen(id)});
    }
    if(X.tries>=3){vqBub('點選項也可以喔！');return vmsg(hearErr(alts,err))}
    vqBub('我沒聽懂，再說一次！');vSay('我沒聽懂，再說一次。',()=>{if(vqLive(id))vqListen(id)});
  });
}
function vqAnswer(i){
  if(scr!=='vq'||X.done)return;
  const q=X.qs[X.i],z=q.z;X.sel=i;exRecord(q,q.opts[i].ok);const id=++X.ask;
  document.querySelectorAll('#vopts .opt').forEach((b,k)=>{b.disabled=true;if(q.opts[k].ok)b.classList.add('right');else if(k===i)b.classList.add('wrong');else b.classList.add('dim')});
  vqBub(X.good?'🎉 答對了！':'💪 沒關係，記住它！');vmsg('');micBtn(false);
  $('#vexp').innerHTML=`<div class="moral ${z?'zb':''}" style="margin-top:8px">💡 ${q.why}</div>`;
  const p=document.querySelectorAll('.pill');if(p[0])p[0].textContent='🪙 '+S.coins;if(p[1])p[1].textContent='💧 '+S.water;
  vSay(fbSay(q,X.good),()=>{if(scr==='vq'&&X.ask===id)setTimeout(()=>{if(scr==='vq'&&X.ask===id)vqNext()},500)});
}
function vqNext(){
  if(scr!=='vq')return;
  X.i++;if(X.i>=X.qs.length)return finishEx();
  renderVQ();
}
function vqPick(i){if(scr!=='vq'||X.done)return;stopHear();vqAnswer(i)}
function vqTalk(){
  if(scr!=='vq'||X.done)return;
  if(rec){stopHear();micBtn(false);vmsg('');return}
  const id=++X.ask;hush();vqListen(id);
}
function vqRep(){if(scr!=='vq'||X.done)return;const id=++X.ask;hush();vqSpeakQ(id)}

function moveBasket(x){GM.bx=Math.max(50,Math.min(GM.W-50,x));$('#bsk').style.transform=`translateX(${GM.bx-50}px)`}
function nextFruit(){
  if(!GM||GM.k!=='fruit')return;
  const q=gameQ();if(!q)return;
  GM.cur={q,done:false};GM.wait=false;
  $('#gq').innerHTML=`<span class="${S.grade<=2?'zb':''}">${q.stem}</span>`;$('#gspk').innerHTML=spkBtn(q.say);
  const o=$('#orch');o.querySelectorAll('.fruit').forEach(e=>e.remove());GM.fr=[];
  const n=q.opts.length,slot=GM.W/n,order=shuffle([...Array(n).keys()]),speed=70+GM.caught*7;

    el.innerHTML=`<span class="fe">${FRUITS[(i+GM.qi)%FRUITS.length]}</span><span class="fl">${op.h}</span>`;

  });

function stepFruit(dt){
  if(GM.wait)return;
  const baseY=GM.H-64;
  for(const f of GM.fr.slice()){
    f.y+=f.v*dt;
    f.el.style.transform=`translate(${f.x-46}px,${f.y}px)`;
    if(f.y>=baseY-58&&Math.abs(f.x-GM.bx)<68){ // 接到了
      if(f.ok){
        GM.caught++;GM.score=GM.caught;sfx('ok');burst(8);$('#gsc').textContent=`🍎 ${GM.caught} / ${GM.total}`;
        GM.wait=true;GM.fr.forEach(x=>x.el.remove());GM.fr=[];
        gTo(()=>GM.caught>=GM.total?endFruit():nextFruit(),500);return;
      }
      f.el.remove();GM.fr=GM.fr.filter(x=>x!==f);loseHeart();if(!GM)return;continue;
    }
    if(f.y>GM.H){
      GM.fr=GM.fr.filter(x=>x!==f);f.el.remove();
      if(f.ok){loseHeart();if(!GM)return;GM.wait=true;GM.fr.forEach(x=>x.el.remove());GM.fr=[];gTo(()=>nextFruit(),600);return}
    }
  }
}
function loseHeart(){
  GM.lives--;sfx('bad');

}

  const w=GM.words[GM.wi],syls=w[2].split(' ');
  if(fresh)buildSpellTiles();
  const target=GM.si<syls.length?[...syls[GM.si]]:[];
  show('spell',`${topBar('🔤 '+(GM.wi+1)+' / '+GM.words.length)}
  <div class="bar"><i style="width:${GM.wi/GM.words.length*100}%"></i></div>
  <div class="card" style="text-align:center"><div style="font-size:84px;line-height:1.2">${w[0]}</div>
    <div style="font-size:38px">${[...w[1]].map((c,i)=>`<span style="${i<GM.si?'color:var(--mint-dd)':i===GM.si?'color:var(--pink-d);border-bottom:4px solid var(--pink-d)':'opacity:.5'}">${esc(c)}</span>`).join(' ')}</div>
    <div class="tip">${spkBtn(w[1])} 拼出「${esc(w[1][GM.si]||'')}」的注音(第 ${GM.si+1} 個字)</div>
    <div class="slots">${target.map((c,i)=>`<div class="slot ${GM.got[i]!=null?'on':''}">${GM.got[i]!=null?esc(GM.tiles[GM.got[i]].c):''}</div>`).join('')}</div></div>
  <div class="tiles">${GM.tiles.map((t,i)=>`<button class="tl ${GM.hint&&t.c===target[GM.got.length]?'hint':''}" data-a="sp" data-i="${i}" ${GM.got.includes(i)?'disabled':''}>${esc(t.c)}</button>`).join('')}</div>
  <div class="row center" style="margin-top:14px"><button class="btn ghost small" data-a="sphint">💡 提示</button><button class="btn ghost small" data-a="spclear">↺ 重來</button></div>`);
  // 注音拼拼是考注音,一開始不自動唸出詞語(聲音就是答案);要聽的話按旁邊的 🔊 當提示
}
function spellTap(i){
  if(!GM||GM.k!=='spell'||GM.lock)return;
  const w=GM.words[GM.wi],target=[...w[2].split(' ')[GM.si]];
  if(GM.tiles[i].c!==target[GM.got.length]){GM.miss++;sfx('bad');GM.got=[];renderSpell(false);const s=document.querySelector('.slots');if(s)s.style.animation='shake .45s';return}
  GM.got.push(i);sfx('coin');
  if(GM.got.length<target.length)return renderSpell(false);
  // 這個字拼完了
  GM.si++;
  if(GM.si>=w[2].split(' ').length){
    GM.score++;if(GM.miss===0&&!GM.hintUsed)GM.perfect++;GM.miss=0;GM.hintUsed=false;sfx('ok');burst(12);speak(w[1]);
    GM.lock=true;renderSpell(false);
    gTo(()=>{GM.lock=false;GM.wi++;GM.si=0;if(GM.wi>=GM.words.length)return endSpell();renderSpell(true)},900);
    return;
  }
  renderSpell(true);
}
function endSpell(){
  const s=GM.score;
  gameEnd('spell','注音拼拼','🔤',s*10+GM.perfect*5,`拼對 ${s} 個詞，其中 ${GM.perfect} 個一次就對`,s*3+GM.perfect,Math.floor(s/2));
}

/* ===== 幸運拉霸：花 8 枚金幣轉一次 ===== */
const SLOT_COST=8;
const PRIZES=[{w:30,e:'🪙',c:4},{w:20,e:'💰',c:10},{w:25,e:'💧',wt:2},{w:10,e:'🚿',wt:5},{w:3,e:'💎',c:40},{w:12,e:'🍀',c:1}];
let spinning=false;
function renderLucky(){
  spinning=false;
  show('lucky',`${topBar(zy('幸運拉霸','ㄒㄧㄥˋ ㄩㄣˋ ㄌㄚ ㄅㄚˋ'))}
  <div class="card" style="text-align:center">
    <div class="tip">花 🪙${SLOT_COST} 轉一次，可能抽到金幣或水滴！</div>
    <div class="reels"><div class="reel" id="r0">🎰</div><div class="reel" id="r1">🎰</div><div class="reel" id="r2">🎰</div></div>
    <div class="fb" id="lres">&nbsp;</div>
    <button class="btn" id="spinb" data-a="spin" ${S.coins<SLOT_COST?'disabled':''}>🎰 轉轉看 (🪙${SLOT_COST})</button>
    <div class="tip" style="margin-top:10px">💎 大獎 🪙40　🚿 水滴 5　💰 金幣 10</div>
  </div>`);
}
function spin(){
  if(spinning)return;
  if(S.coins<SLOT_COST){sfx('bad');return toast('金幣不夠喔')}
  spinning=true;S.coins-=SLOT_COST;save();
  let tot=PRIZES.reduce((a,p)=>a+p.w,0),r=R(1,tot),prize=PRIZES[0];
  for(const p of PRIZES){if(r<=p.w){prize=p;break}r-=p.w}
  const rs=[0,1,2].map(i=>$('#r'+i)),faces=PRIZES.map(p=>p.e);
  $('#spinb').disabled=true;$('#lres').textContent='…';
  const iv=setInterval(()=>rs.forEach(el=>{el.textContent=pick(faces)}),90);
  [700,1100,1500].forEach((ms,i)=>setTimeout(()=>{rs[i].textContent=prize.e;sfx('coin')},ms));
  setTimeout(()=>{
    clearInterval(iv);
    if(scr!=='lucky')return;
    if(prize.c)S.coins+=prize.c;if(prize.wt)S.water+=prize.wt;save();
    sfx('win');burst(prize.c>=10?24:10);
    $('#lres').textContent=prize.c?`🪙 +${prize.c}!`:`💧 +${prize.wt}!`;
    $('#spinb').disabled=S.coins<SLOT_COST;spinning=false;
    document.querySelectorAll('.pill')[0].textContent='🪙 '+S.coins;document.querySelectorAll('.pill')[1].textContent='💧 '+S.water;
  },1700);
}

    case 'vrep':return vqRep();
    case 'vnext':return vqNext();
    case 'vtest':return speak('你好，我是小雞老師，我們一起學國語吧！',true);
    case 'vrate':{const L=[1,1.15,1.3],cur=rateNow(),k=L.reduce((b,v,i)=>Math.abs(v-cur)<Math.abs(L[b]-cur)?i:b,0);S.rate=L[(k+1)%3];save();renderSettings();return speak('這是我現在的速度。',true)}
    case 'quiz':return startQuiz('normal');
    case 'retry':return startQuiz('retry');
    case 'boss':return startQuiz('boss');
    case 'chat':return chatSay();
    case 'lucky':return renderLucky();
    case 'spin':return spin();
    case 'parent':return parentGate();
    case 'copybk':{const b=$('#bk');b.select();try{document.execCommand('copy');toast('已複製')}catch(e){toast('請長按文字複製')}return}
    case 'restore':{
      let o;try{o=JSON.parse($('#rs').value);if(!o||typeof o!=='object'||!Array.isArray(o.plots))throw 0}
      catch(e){return toast('備份文字不正確')}
      return ask('用這份備份取代目前的紀錄？',()=>{S=normSave(o);save();toast('還原好了');renderHome()})}
    case 'chpin':return pinModal('change');
    case 'pinok':return pinOk();
    case 'cfyes':{const fn=CF;CF=null;closeModal();if(fn)fn();return}
    case 'pick':return pickOpt(+d.i);
    case 'qnext':return nextQ();
    case 'sort':return startSort();
    case 'tile':return sortTile(+d.i);
    case 'sclear':P.got=[];return renderSort();
    case 'snext':return sortNext();
    case 'flip':return startFlip();
    case 'card':return flipCard(+d.i);
    case 'farm':closeModal();return renderFarm();
    case 'exam':return renderExam();
    case 'grade2':S.grade=+d.g;save();return scr==='exam'?renderExam():renderIdiomHub();
    case 'idiomhub':return renderIdiomHub();
    case 'mock':return startEx('mock');
    case 'extype':return startEx('type',d.t);
    case 'wrongbook':return startEx('wrong');
    case 'xpick':return xPick(+d.i);
    case 'xnext':return xNext();
    case 'xtile':X.chain.push(+d.i);return renderXQ();
    case 'xundo':X.chain.splice(+d.k,1);return renderXQ();
    case 'xclear':X.chain=[];return renderXQ();
    case 'xok':return xOrderOk();
    case 'midhub':return renderMidHub();
    case 'midstart':return startMid(d.id);
    case 'mpick':if(MD&&scr==='mq'){const was=mAns(MD.i);MD.ans[MD.i]=+d.i;sfx('coin');renderMQ(true);
      if(!was){const dn=MD.qs.filter((_,k)=>mAns(k)).length;
        if(dn===Math.ceil(MD.qs.length/2))speak('過半了，你好棒，繼續加油！');
        else if(dn===MD.qs.length){speak('全部寫完了！太厲害了，檢查一下就可以交卷囉！');cheer('🥳','全部寫完啦！','你好有毅力！')}}}return;
    case 'mtile':if(MD&&scr==='mq'){const a=MD.ans[MD.i];MD.ans[MD.i]=(Array.isArray(a)?a:[]).concat(+d.i);sfx('coin');renderMQ(true)}return;
    case 'mundo':if(MD&&scr==='mq'){MD.ans[MD.i]=(MD.ans[MD.i]||[]).filter((_,k)=>k!==+d.k);renderMQ(true)}return;
    case 'mclear':if(MD&&scr==='mq'){MD.ans[MD.i]=[];renderMQ(true)}return;
    case 'mgo':if(MD&&scr==='mq'){closeModal();MD.i=+d.k;renderMQ()}return;
    case 'mnext':if(MD&&scr==='mq'&&MD.i<MD.qs.length-1){MD.i++;renderMQ()}return;
    case 'mprev':if(MD&&scr==='mq'&&MD.i>0){MD.i--;renderMQ()}return;
    case 'msubmit':return submitMid();
    case 'msubmit2':return submitMid(true);
    case 'leave':closeModal();MD=null;return renderHome();
    case 'games':return renderGames();
    case 'g_mole':return startMole();
    case 'g_fish':return startFish();
    case 'g_fruit':return startFruit();
    case 'g_spell':return startSpell();
    case 'g_lucky':return renderLucky();
    case 'mole':return moleHit(+d.h);
    case 'fish':return fishHit(+d.i,t);
    case 'bl':if(GM&&GM.k==='fruit')moveBasket(GM.bx-70);return;
    case 'br':if(GM&&GM.k==='fruit')moveBasket(GM.bx+70);return;
    case 'sp':return spellTap(+d.i);
    case 'sphint':if(GM&&GM.k==='spell'){GM.hint=true;GM.hintUsed=true;renderSpell(false)}return;
    case 'spclear':if(GM&&GM.k==='spell'){GM.got=[];renderSpell(false)}return;
    case 'book':return renderBook();
    case 'booktab':return renderBook(+d.g);
    case 'settings':return renderSettings();
    case 'tsound':S.sound=!S.sound;save();return renderSettings();
    case 'tvoice':S.voice=!S.voice;save();return renderSettings();
    case 'reset':
      return ask('確定要清除所有紀錄嗎？農場和成績都會不見喔！',()=>ask('真的要全部重來嗎？',()=>{S=DEF();save();renderHome()}));
    default:if(FARM_ACTS.has(a))return farmAct(a,d,t);
  }
});

renderHome();
dailyBonus();
document.getElementById('view').setAttribute('data-ok','1');
})();
</script>

</body>
